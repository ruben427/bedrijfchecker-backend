<!DOCTYPE html>
<meta charset="utf-8">
<title>Instellingen — PepProof admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="solike.css">
<link rel="stylesheet" href="solike-admin.css">

<style>
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-tekst); font-size:16px; line-height:1.55 }
  .kop-balk{ background:var(--surface); height:60px; position:relative; z-index:2 }
  .kop-in{ max-width:1180px; margin:0 auto; padding:12px 16px 0; height:100%;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px }
  .merk img{ display:block; height:80px; width:auto }
  .terugnaar{ align-self:center; font-size:.9rem; color:var(--accent);
    text-decoration:underline; text-underline-offset:3px }

  .inhoud{ max-width:1180px; margin:0 auto; padding:60px 16px 96px;
    display:grid; grid-template-columns:220px 1fr; gap:32px; align-items:start }
  @media (max-width:820px){ .inhoud{ grid-template-columns:1fr; padding-top:24px } }

  /* Het menu links. Nu één kopje; dit is de plek waar de rest bij komt. */
  .zijmenu{ position:sticky; top:16px; display:flex; flex-direction:column; gap:2px }
  .zijmenu h2{ font-family:var(--font-kop); font-weight:600; font-size:.78rem;
    text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint);
    margin:0 0 8px }
  .zijmenu button{ text-align:left; border:0; background:none; cursor:pointer;
    font:inherit; padding:8px 12px; border-radius:8px; color:var(--text) }
  .zijmenu button:hover{ background:var(--purple-50) }
  .zijmenu button[aria-current="true"]{ background:var(--purple-50);
    color:var(--heading); font-weight:600 }

  h1{ font-family:var(--font-kop); font-weight:600; font-size:2rem; line-height:1.1;
    letter-spacing:-.03em; color:var(--heading-3); margin:0 0 4px }
  .sub{ color:var(--text-subtle); margin:0 0 28px; font-size:.95rem }
  .blok{ background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md,12px); padding:24px; margin-bottom:16px }
  .blok h3{ font-family:var(--font-kop); font-weight:600; font-size:1.15rem;
    color:var(--heading-2); margin:0 0 2px }
  .duiding{ color:var(--text-subtle); font-size:.88rem; margin:0 0 18px }

  /* De entiteit als kop van zijn eigen blok, met hetzelfde badge als in de
     leverancierslijst zodat je ziet dat het over hetzelfde gaat. */
  .entkop{ display:flex; align-items:center; gap:12px; margin:0 0 4px }
  .ent{ display:inline-flex; align-items:center; justify-content:center;
    padding:4px 12px; border-radius:4px; font-family:var(--font-kop); font-weight:400;
    font-size:18px; line-height:1; letter-spacing:-.9px; color:#fff }
  .ent.nl{ background:var(--accent-light) } .ent.eu{ background:var(--purple-600) }
  .ent.ow{ background:var(--text-subtle) }

  .laag{ margin:18px 0 0 }
  .laag:first-of-type{ margin-top:8px }
  .laagkop{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:0 0 8px }
  .laagkop b{ font-family:var(--font-kop); font-weight:600; font-size:.95rem;
    color:var(--heading-3) }
  .laagkop span{ font-size:.82rem; color:var(--text-subtle) }
  .laagkop .tel{ margin-left:auto; font-size:.8rem; color:var(--text-faint) }

  /* DE PILLEN. Uit is een grijze outline, aan is het blauw van het logo.
     Het is een aan-uitknop, dus aria-pressed en geen checkbox die je niet ziet. */
  .pillen{ display:flex; flex-wrap:wrap; gap:8px }
  .pil{ border:1px solid var(--border); background:var(--surface);
    color:var(--text-subtle); font:inherit; font-size:.84rem; line-height:1.2;
    padding:6px 14px; border-radius:999px; cursor:pointer;
    transition:background .12s, border-color .12s, color .12s }
  .pil:hover{ border-color:var(--blauw-300); color:var(--text) }
  .pil[aria-pressed="true"]{ background:var(--blauw-500); border-color:var(--blauw-500);
    color:#fff }
  .pil[aria-pressed="true"]:hover{ background:var(--blauw-600); border-color:var(--blauw-600) }
  .pil:focus-visible{ outline:2px solid var(--blauw-500); outline-offset:2px }
  /* Een persoonsgegeven draagt een stip. Publiek op te vragen is niet
     hetzelfde als vrij te publiceren, en dat hoort zichtbaar te zijn op het
     scherm waar je hem aanzet. */
  .pil.pg::before{ content:'•'; margin-right:6px; opacity:.6 }

  .knoppen{ display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap }
  .melding{ margin-top:12px; padding:10px 12px; border-radius:10px; font-size:.88rem;
    background:var(--surface-2); border:1px solid var(--border) }
  .melding[hidden]{ display:none }
  .leeg{ padding:20px; color:var(--text-faint); font-size:.9rem }
  .fout{ color:var(--danger) }
  .rij2{ display:grid; grid-template-columns:1fr 1fr; gap:14px }
  @media (max-width:640px){ .rij2{ grid-template-columns:1fr } }
  .vink{ display:flex; align-items:center; gap:8px; font-size:.9rem; margin:10px 0 }
</style>

<header class="kop-balk">
  <div class="kop-in">
    <div class="merk">
      <img src="PEPPROOF-ADMIN-LOGO-BLAUW.svg" width="398" height="80" alt="PepProof — admin panel">
    </div>
    <a class="terugnaar" href="admin.html">← terug naar de admin</a>
  </div>
</header>

<main class="inhoud">
  <nav class="zijmenu" id="zijmenu">
    <h2>Instellingen</h2>
    <button type="button" data-blad="leverancier" aria-current="true">Leverancier</button>
  </nav>

  <section id="blad">
    <p class="leeg">Laden…</p>
  </section>
</main>

<script>
(function () {
  'use strict';
  var API_BASE = 'https://bedrijfchecker-backend-production.up.railway.app';

  // Dezelfde sleutel als de admin. Deze pagina heeft bewust GEEN eigen
  // inlogscherm: twee plekken waar je een sleutel intikt is een plek te veel,
  // en een tweede formulier is een tweede kans om hem ergens anders neer te
  // zetten. Ben je hier niet aangemeld, dan wijst de pagina naar de admin.
  var SLEUTEL_TOKEN = 'pepproof.adminSleutel';
  var SLEUTEL_NAAM = 'pepproof.adminNaam';

  function el(id) { return document.getElementById(id); }
  function lees(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var token = lees(SLEUTEL_TOKEN), naam = lees(SLEUTEL_NAAM);
  var data = { velden: [], profielen: {}, groepen: [], entiteiten: [], lagen: [] };
  var magSchrijven = false, zonderNaam = false;

  function haal(pad, opties) {
    var o = opties || {};
    var h = { 'X-Owner-Token': token };
    if (o.headers) for (var k in o.headers) h[k] = o.headers[k];
    return fetch(API_BASE + pad, { method: o.method || 'GET', headers: h, body: o.body })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
          throw new Error((j && j.message) || ('HTTP ' + r.status));
        });
        return r.json();
      });
  }

  var ENT = {
    nl: { klas: 'nl', titel: 'Nederland',
      uitleg: 'Een Nederlandse vestiging. Hier ligt de meeste wetgeving, en hier is het meeste na te gaan.' },
    eu: { klas: 'eu', titel: 'Europese Unie',
      uitleg: 'Binnen de EU gevestigd, buiten Nederland.' },
    ow: { klas: 'ow', titel: 'Buiten de EU',
      uitleg: 'Wereldwijd. Registers zijn hier zelden openbaar en vaak niet na te gaan.' }
  };
  var LAAG = {
    verzamelen: { titel: 'Verzamelen',
      uitleg: 'Hier gaat de crawler naar op zoek, en het staat als open taak in de admin.' },
    free: { titel: 'In de gratis check',
      uitleg: 'Wat een bezoeker zonder te betalen te zien krijgt.' },
    deepdive: { titel: 'In de Deep Dive',
      uitleg: 'Het betaalde deel.' }
  };
  var GROEPNAAM = {
    naam: 'Naam', adres: 'Adres', register: 'Register', verzending: 'Verzending',
    contact: 'Contact', handel: 'Handel', verband: 'Waar het aan vastzit',
    vindbaar: 'Vindbaar', personen: 'Personen'
  };

  // Wat er op het scherm staat, per entiteit en laag. De knop Vastleggen
  // stuurt dit naar de server; tot dan is er niets veranderd.
  var keuze = {};

  function laadKeuze() {
    keuze = {};
    data.entiteiten.forEach(function (e) {
      keuze[e] = {};
      data.lagen.forEach(function (l) {
        keuze[e][l] = new Set(((data.profielen[e] || {})[l]) || []);
      });
    });
  }

  function pil(e, l, v) {
    var aan = keuze[e][l].has(v.id);
    return '<button type="button" class="pil' + (v.persoonsgegeven ? ' pg' : '') + '"' +
      ' aria-pressed="' + aan + '" data-e="' + esc(e) + '" data-l="' + esc(l) + '"' +
      ' data-v="' + esc(v.id) + '"' +
      (v.hulp ? ' title="' + esc(v.hulp) + '"' : '') + '>' + esc(v.label) + '</button>';
  }

  function laagBlok(e, l) {
    var d = LAAG[l] || { titel: l, uitleg: '' };
    var aantal = keuze[e][l].size;
    return '<div class="laag" data-laag="' + esc(l) + '">' +
      '<div class="laagkop"><b>' + esc(d.titel) + '</b><span>' + esc(d.uitleg) + '</span>' +
        '<span class="tel">' + aantal + ' van ' + data.velden.length + '</span></div>' +
      '<div class="pillen">' + data.velden.map(function (v) { return pil(e, l, v); }).join('') + '</div>' +
      '</div>';
  }

  function entBlok(e) {
    var d = ENT[e] || { klas: '', titel: e, uitleg: '' };
    return '<div class="blok" data-ent="' + esc(e) + '">' +
      '<div class="entkop"><span class="ent ' + d.klas + '">' + esc(e.toUpperCase()) + '</span>' +
        '<h3>' + esc(d.titel) + '</h3></div>' +
      '<p class="duiding">' + esc(d.uitleg) + '</p>' +
      data.lagen.map(function (l) { return laagBlok(e, l); }).join('') +
      (magSchrijven ? '<div class="knoppen">' +
        '<button type="button" class="knop prim" data-bewaar="' + esc(e) + '">Vastleggen</button>' +
        '<button type="button" class="knop sec klein" data-herstel="' + esc(e) + '">Terug naar opgeslagen</button>' +
        '</div>' : '') +
      '<p class="melding" id="m-' + esc(e) + '" hidden></p>' +
      '</div>';
  }

  function nieuwVeldBlok() {
    if (!magSchrijven) return '';
    var opties = data.groepen.map(function (g) {
      return '<option value="' + esc(g) + '">' + esc(GROEPNAAM[g] || g) + '</option>';
    }).join('');
    return '<div class="blok"><h3>Een veld erbij</h3>' +
      '<p class="duiding">Het nieuwe veld verschijnt meteen bij elke leverancier, en hierboven als pil. ' +
      'Hij staat nergens aan tot je hem aanzet.</p>' +
      '<form id="nvForm">' +
        '<div class="rij2">' +
          '<label class="veld"><input type="text" id="nvLabel" placeholder=" ">' +
            '<span class="veld-label">Hoe heet het veld?</span></label>' +
          '<label class="veld keuze"><select id="nvGroep">' + opties + '</select>' +
            '<span class="veld-label">In welke groep?</span></label>' +
        '</div>' +
        '<label class="veld"><input type="text" id="nvHulp" placeholder=" ">' +
          '<span class="veld-label">Hulptekst — wat moet iemand invullen?</span></label>' +
        '<label class="vink"><input type="checkbox" id="nvPg"> ' +
          'Dit is een persoonsgegeven</label>' +
        '<p class="duiding" style="margin:0 0 12px">Publiek op te vragen is niet hetzelfde als vrij te publiceren. ' +
        'Een veld met dit vinkje krijgt een stip en kan straks in één regel uit het publieke rapport worden gehouden.</p>' +
        '<p><button type="submit" class="knop prim">Toevoegen</button></p>' +
        '<p class="melding" id="nvMelding" hidden></p>' +
      '</form></div>';
  }

  function teken() {
    if (!token) {
      el('blad').innerHTML = '<h1>Instellingen</h1>' +
        '<p class="sub">Je bent hier niet aangemeld.</p>' +
        '<div class="blok"><p>Deze pagina gebruikt dezelfde sleutel als de admin. ' +
        'Meld je daar aan, dan werkt het hier ook.</p>' +
        '<p style="margin-top:12px"><a class="knop prim" href="admin.html">Naar de admin</a></p></div>';
      return;
    }
    el('blad').innerHTML = '<h1>Leverancier</h1>' +
      '<p class="sub">Welke gegevens we per entiteit willen hebben, en waar ze terechtkomen. ' +
      (magSchrijven ? ''
        : zonderNaam ? 'Er staat geen naam bij je sleutel in deze browser. Meld je opnieuw aan in de admin — elk profiel draagt wie het vastlegde.'
        : 'Je kijkt mee met een leestoken — aanpassen kan niet.') + '</p>' +
      '<div class="blok" style="background:var(--purple-50)">' +
        '<p class="duiding" style="margin:0">Drie lagen, en ze vallen niet samen. ' +
        '<strong>Verzamelen</strong> is wat we ophalen, <strong>gratis</strong> en <strong>Deep Dive</strong> ' +
        'is wat we tonen. Een veld dat je wel wilt weten maar niet wilt tonen — bestuurders bijvoorbeeld — ' +
        'staat alleen op verzamelen.</p></div>' +
      data.entiteiten.map(entBlok).join('') +
      nieuwVeldBlok();
    bind();
  }

  function melding(id, tekst, fout) {
    var p = document.getElementById(id);
    if (!p) return;
    p.textContent = tekst; p.hidden = false;
    p.className = 'melding' + (fout ? ' fout' : '');
  }

  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll('.pil'), function (b) {
      if (!magSchrijven) { b.disabled = true; return; }
      b.addEventListener('click', function () {
        var e = b.getAttribute('data-e'), l = b.getAttribute('data-l'), v = b.getAttribute('data-v');
        var s = keuze[e][l];
        if (s.has(v)) s.delete(v); else s.add(v);
        b.setAttribute('aria-pressed', String(s.has(v)));
        var tel = b.closest('.laag').querySelector('.tel');
        if (tel) tel.textContent = s.size + ' van ' + data.velden.length;
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-bewaar]'), function (b) {
      b.addEventListener('click', function () {
        var e = b.getAttribute('data-bewaar');
        b.disabled = true;
        // Per laag een verzoek: de server vervangt de hele lijst van die laag,
        // dus half opsturen zou half uitzetten betekenen.
        Promise.all(data.lagen.map(function (l) {
          return haal('/api/admin/velden/profiel', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ entiteit: e, laag: l,
              velden: Array.prototype.slice.call(keuze[e][l]), door: naam })
          });
        })).then(function () {
          data.lagen.forEach(function (l) {
            if (!data.profielen[e]) data.profielen[e] = {};
            data.profielen[e][l] = Array.prototype.slice.call(keuze[e][l]);
          });
          melding('m-' + e, 'Vastgelegd.');
        }).catch(function (err) {
          melding('m-' + e, 'Mislukt: ' + err.message, true);
        }).then(function () { b.disabled = false; });
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-herstel]'), function (b) {
      b.addEventListener('click', function () { laadKeuze(); teken(); });
    });

    var f = document.getElementById('nvForm');
    if (f) f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var label = document.getElementById('nvLabel').value.trim();
      if (label.length < 2) { melding('nvMelding', 'Geef het veld een naam.', true); return; }
      haal('/api/admin/velden', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: label,
          groep: document.getElementById('nvGroep').value,
          hulp: document.getElementById('nvHulp').value.trim(),
          persoonsgegeven: document.getElementById('nvPg').checked, door: naam })
      }).then(function () { return laden(); })
        .catch(function (err) { melding('nvMelding', 'Mislukt: ' + err.message, true); });
    });
  }

  function laden() {
    return haal('/api/admin/wie-ben-ik').then(function (j) {
      // Aanpassen is redactiewerk, net als een labstand vastleggen. Een lezer
      // ziet de pagina wel: weten wat er is ingesteld is geen schrijfrecht.
      // magBeoordelen en niet de rolnaam: de server rekent dat al uit, en een
      // tweede lijstje rolnamen hier zou bij een nieuwe rol stil achterlopen.
      //
      // ZONDER NAAM GEEN SCHRIJFRECHT. Elk oordeel in dit systeem draagt wie
      // het vastlegde; een profiel zonder naam zou de enige uitzondering zijn.
      // De naam komt uit het aanmelden in de admin.
      magSchrijven = !!(j && j.magBeoordelen) && !!naam;
      zonderNaam = !!(j && j.magBeoordelen) && !naam;
      return haal('/api/admin/velden');
    }).then(function (j) {
      data = { velden: j.velden || [], profielen: j.profielen || {},
        groepen: j.groepen || [], entiteiten: j.entiteiten || [], lagen: j.lagen || [] };
      laadKeuze();
      teken();
    }).catch(function (e) {
      el('blad').innerHTML = '<h1>Instellingen</h1><p class="fout">Ophalen mislukt: ' +
        esc(e.message) + '</p>';
    });
  }

  if (!token) teken(); else laden();
})();
</script>
