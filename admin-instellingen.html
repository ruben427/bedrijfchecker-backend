<!DOCTYPE html>
<meta charset="utf-8">
<title>Instellingen — PepProof admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Open+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="solike.css">
<link rel="stylesheet" href="solike-admin.css">

<style>
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:var(--font-tekst); font-size:16px; line-height:1.55 }
  .kop-balk{ background:var(--surface); height:60px; position:relative; z-index:2 }
  .kop-in{ max-width:1180px; margin:0 auto; padding:12px 16px 0; height:100%;
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px }
  .merk img{ display:block; height:80px; width:auto }
  .terugnaar{ align-self:center; font-size:.9rem; color:var(--accent);
    text-decoration:underline; text-underline-offset:3px }

  .inhoud{ max-width:1180px; margin:0 auto; padding:60px 16px 96px;
    display:grid; grid-template-columns:220px 1fr; gap:32px; align-items:start }
  @media (max-width:820px){ .inhoud{ grid-template-columns:1fr; padding-top:24px } }

  /* Het menu links. Nu één kopje; dit is de plek waar de rest bij komt. */
  .zijmenu{ position:sticky; top:16px; display:flex; flex-direction:column; gap:2px }
  .zijmenu h2{ font-family:var(--font-kop); font-weight:600; font-size:.78rem;
    text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint);
    margin:0 0 8px }
  .zijmenu button{ text-align:left; border:0; background:none; cursor:pointer;
    font:inherit; padding:8px 12px; border-radius:8px; color:var(--text) }
  .zijmenu button:hover{ background:var(--purple-50) }
  .zijmenu button[aria-current="true"]{ background:var(--purple-50);
    color:var(--heading); font-weight:600 }

  h1{ font-family:var(--font-kop); font-weight:600; font-size:2rem; line-height:1.1;
    letter-spacing:-.03em; color:var(--heading-3); margin:0 0 4px }
  .sub{ color:var(--text-subtle); margin:0 0 28px; font-size:.95rem }
  .blok{ background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius-md,12px); padding:24px; margin-bottom:16px }
  .blok h3{ font-family:var(--font-kop); font-weight:600; font-size:1.15rem;
    color:var(--heading-2); margin:0 0 2px }
  .duiding{ color:var(--text-subtle); font-size:.88rem; margin:0 0 18px }

  /* De entiteit als kop van zijn eigen blok, met hetzelfde badge als in de
     leverancierslijst zodat je ziet dat het over hetzelfde gaat. */
  .entkop{ display:flex; align-items:center; gap:12px; margin:0 0 4px }
  .ent{ display:inline-flex; align-items:center; justify-content:center;
    padding:4px 12px; border-radius:4px; font-family:var(--font-kop); font-weight:400;
    font-size:18px; line-height:1; letter-spacing:-.9px; color:#fff }
  .ent.nl{ background:var(--accent-light) } .ent.eu{ background:var(--purple-600) }
  .ent.ow{ background:var(--text-subtle) }

  /* Elke laag klapt open. Dicht zie je alleen de naam en hoeveel er aanstaat;
     twee rijen van eenendertig pillen tegelijk is niet te overzien. */
  .laag{ margin:10px 0 0; border:1px solid var(--border); border-radius:var(--radius-md,12px);
    overflow:hidden }
  .laagkop{ width:100%; display:flex; align-items:center; gap:12px; border:0;
    background:var(--surface); font:inherit; text-align:left; cursor:pointer;
    padding:14px 16px }
  .laagkop:hover{ background:var(--purple-50) }
  .laagkop:focus-visible{ outline:2px solid var(--blauw-500); outline-offset:-2px }
  .laagkop b{ font-family:var(--font-kop); font-weight:600; font-size:.95rem;
    color:var(--heading-3); flex:none }
  .laagkop .wat{ font-size:.82rem; color:var(--text-subtle); min-width:0;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  .laagkop .tel{ margin-left:auto; font-size:.8rem; color:var(--text-faint); flex:none }
  .chev{ width:18px; height:18px; flex:none; color:var(--text-subtle);
    transition:transform .15s }
  .laagkop[aria-expanded="true"] .chev{ transform:rotate(180deg) }
  .laagkop[aria-expanded="true"]{ border-bottom:1px solid var(--border) }
  .laaglijf{ padding:16px }
  .laaglijf[hidden]{ display:none }

  /* DE PILLEN. Uit is een grijze outline, aan is het blauw van het logo.
     Het is een aan-uitknop, dus aria-pressed en geen checkbox die je niet ziet. */
  .pillen{ display:flex; flex-wrap:wrap; gap:8px }
  .pil{ border:1px solid var(--border); background:var(--surface);
    color:var(--text-subtle); font:inherit; font-size:.84rem; line-height:1.2;
    padding:6px 14px; border-radius:999px; cursor:pointer;
    transition:background .12s, border-color .12s, color .12s }
  .pil:hover{ border-color:var(--blauw-300); color:var(--text) }
  .pil[aria-pressed="true"]{ background:var(--blauw-500); border-color:var(--blauw-500);
    color:#fff }
  .pil[aria-pressed="true"]:hover{ background:var(--blauw-600); border-color:var(--blauw-600) }
  .pil:focus-visible{ outline:2px solid var(--blauw-500); outline-offset:2px }
  /* Een persoonsgegeven draagt een stip. Publiek op te vragen is niet
     hetzelfde als vrij te publiceren, en dat hoort zichtbaar te zijn op het
     scherm waar je hem aanzet. */
  .pil.pg::before{ content:'•'; margin-right:6px; opacity:.6 }

  .knoppen{ display:flex; gap:10px; align-items:center; margin-top:14px; flex-wrap:wrap }
  .melding{ margin-top:12px; padding:10px 12px; border-radius:10px; font-size:.88rem;
    background:var(--surface-2); border:1px solid var(--border) }
  .melding[hidden]{ display:none }
  .leeg{ padding:20px; color:var(--text-faint); font-size:.9rem }
  .fout{ color:var(--danger) }
  .rij2{ display:grid; grid-template-columns:1fr 1fr; gap:14px }
  @media (max-width:640px){ .rij2{ grid-template-columns:1fr } }
  .vink{ display:flex; align-items:center; gap:8px; font-size:.9rem; margin:10px 0 }

  /* De site live of offline. Dezelfde pil als in de kopbalk van de admin, zodat
     het op twee plekken hetzelfde ding is en niet twee verschillende dingen. */
  /* Een stap in de gratis check: aanzetten is een pil, maar hier hoort wat
     hij kost en wat hij oplevert naast te staan. Daarom een regel en geen rij
     pillen - dit is een keuze per stap, geen lijstje afvinken. */
  .staprij{ display:grid; grid-template-columns:auto 1fr auto; gap:14px;
    align-items:start; padding:14px 0; border-top:1px solid var(--border) }
  .staprij:first-of-type{ border-top:0 }
  .staprij .wat b{ font-family:var(--font-kop); font-weight:600; font-size:1rem;
    color:var(--heading-3); display:block }
  .staprij .wat span{ font-size:.85rem; color:var(--text-subtle) }
  .staprij .duur{ font-size:.82rem; color:var(--text-faint); white-space:nowrap;
    text-align:right; font-variant-numeric:tabular-nums }
  .draagt{ font-size:.7rem; padding:2px 8px; border-radius:999px; white-space:nowrap;
    border:1px solid var(--ok); color:var(--ok); background:var(--ok-soft);
    margin-left:8px; vertical-align:middle }
  .waarschuwing{ margin:14px 0 0; padding:12px 14px; border-radius:10px;
    border:1px solid var(--warn); background:var(--warn-soft); font-size:.88rem }
  .waarschuwing[hidden]{ display:none }

  .standrij{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; margin:0 0 16px }
  .stand-knop{ display:inline-flex; align-items:center; gap:10px; cursor:pointer;
    border:1px solid var(--ok); background:var(--ok-soft); color:var(--ok);
    border-radius:999px; padding:8px 16px; font:inherit; font-size:.9rem }
  .stand-knop .bol{ width:10px; height:10px; border-radius:50%; background:currentColor }
  .stand-knop.uit{ flex-direction:row-reverse; border-color:var(--danger);
    background:var(--danger-soft); color:var(--danger) }
  .stand-knop.onbekend{ border-style:dashed; border-color:var(--border);
    background:none; color:var(--text-faint) }
  .stand-knop[disabled]{ cursor:not-allowed; opacity:.6 }
</style>

<header class="kop-balk">
  <div class="kop-in">
    <div class="merk">
      <img src="PEPPROOF-ADMIN-LOGO-BLAUW.svg" width="398" height="80" alt="PepProof — admin panel">
    </div>
    <a class="terugnaar" href="admin.html">← terug naar de admin</a>
  </div>
</header>

<main class="inhoud">
  <nav class="zijmenu" id="zijmenu">
    <h2>Leverancier</h2>
    <button type="button" data-blad="bedrijfsgegevens" aria-current="true">Bedrijfsgegevens</button>
    <h2 style="margin-top:18px">Check</h2>
    <button type="button" data-blad="lagen">Gratis of Deep Dive</button>
    <h2 style="margin-top:18px">Site</h2>
    <button type="button" data-blad="site">Live of offline</button>
  </nav>

  <section id="blad">
    <p class="leeg">Laden…</p>
  </section>
</main>

<script>
(function () {
  'use strict';
  var API_BASE = 'https://bedrijfchecker-backend-production.up.railway.app';

  // Dezelfde sleutel als de admin. Deze pagina heeft bewust GEEN eigen
  // inlogscherm: twee plekken waar je een sleutel intikt is een plek te veel,
  // en een tweede formulier is een tweede kans om hem ergens anders neer te
  // zetten. Ben je hier niet aangemeld, dan wijst de pagina naar de admin.
  var SLEUTEL_TOKEN = 'pepproof.adminSleutel';
  var SLEUTEL_NAAM = 'pepproof.adminNaam';

  function el(id) { return document.getElementById(id); }
  function lees(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var token = lees(SLEUTEL_TOKEN), naam = lees(SLEUTEL_NAAM);
  var data = { velden: [], profielen: {}, groepen: [], entiteiten: [], lagen: [] };
  var magSchrijven = false, zonderNaam = false, magDeurDicht = false;
  var blad = 'bedrijfsgegevens', stand = null;

  function haal(pad, opties) {
    var o = opties || {};
    var h = { 'X-Owner-Token': token };
    if (o.headers) for (var k in o.headers) h[k] = o.headers[k];
    return fetch(API_BASE + pad, { method: o.method || 'GET', headers: h, body: o.body })
      .then(function (r) {
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) {
          throw new Error((j && j.message) || ('HTTP ' + r.status));
        });
        return r.json();
      });
  }

  var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M6 9l6 6 6-6"/></svg>';

  var ENT = {
    nl: { klas: 'nl', titel: 'Nederland',
      uitleg: 'Een Nederlandse vestiging. Hier ligt de meeste wetgeving, en hier is het meeste na te gaan.' },
    eu: { klas: 'eu', titel: 'Europese Unie',
      uitleg: 'Binnen de EU gevestigd, buiten Nederland.' },
    ow: { klas: 'ow', titel: 'Buiten de EU',
      uitleg: 'Wereldwijd. Registers zijn hier zelden openbaar en vaak niet na te gaan.' }
  };
  var LAAG = {
    free: { titel: 'In de gratis check',
      uitleg: 'Wat een bezoeker zonder te betalen te zien krijgt.' },
    deepdive: { titel: 'In de Deep Dive',
      uitleg: 'Het betaalde deel.' }
  };
  var GROEPNAAM = {
    naam: 'Naam', adres: 'Adres', register: 'Register', verzending: 'Verzending',
    contact: 'Contact', handel: 'Handel', verband: 'Waar het aan vastzit',
    vindbaar: 'Vindbaar', personen: 'Personen'
  };

  // Wat er op het scherm staat, per entiteit en laag. De knop Vastleggen
  // stuurt dit naar de server; tot dan is er niets veranderd.
  var keuze = {};

  function laadKeuze() {
    keuze = {};
    data.entiteiten.forEach(function (e) {
      keuze[e] = {};
      data.lagen.forEach(function (l) {
        keuze[e][l] = new Set(((data.profielen[e] || {})[l]) || []);
      });
    });
  }

  function pil(e, l, v) {
    var aan = keuze[e][l].has(v.id);
    return '<button type="button" class="pil' + (v.persoonsgegeven ? ' pg' : '') + '"' +
      ' aria-pressed="' + aan + '" data-e="' + esc(e) + '" data-l="' + esc(l) + '"' +
      ' data-v="' + esc(v.id) + '"' +
      (v.hulp ? ' title="' + esc(v.hulp) + '"' : '') + '>' + esc(v.label) + '</button>';
  }

  // Onthouden wat openstond, zodat een hertekening na het vastleggen niet
  // alles dichtklapt onder je handen.
  var open = {};

  function laagBlok(e, l) {
    var d = LAAG[l] || { titel: l, uitleg: '' };
    var sleutel = e + ':' + l;
    var uit = !open[sleutel];
    return '<div class="laag" data-laag="' + esc(l) + '">' +
      '<button type="button" class="laagkop" data-klap="' + esc(sleutel) + '"' +
        ' aria-expanded="' + (!uit) + '" aria-controls="lijf-' + esc(sleutel) + '">' +
        CHEV + '<b>' + esc(d.titel) + '</b><span class="wat">' + esc(d.uitleg) + '</span>' +
        '<span class="tel" data-tel="' + esc(sleutel) + '">' + keuze[e][l].size +
        ' van ' + data.velden.length + '</span></button>' +
      '<div class="laaglijf" id="lijf-' + esc(sleutel) + '"' + (uit ? ' hidden' : '') + '>' +
        '<div class="pillen">' +
          data.velden.map(function (v) { return pil(e, l, v); }).join('') + '</div>' +
        (magSchrijven ? '<div class="knoppen">' +
          '<button type="button" class="knop prim" data-bewaar="' + esc(sleutel) + '">Vastleggen</button>' +
          '<button type="button" class="knop sec klein" data-herstel="' + esc(sleutel) + '">Annuleren</button>' +
          '</div>' : '') +
        '<p class="melding" id="m-' + esc(sleutel).replace(/:/g, '-') + '" hidden></p>' +
      '</div></div>';
  }

  function entBlok(e) {
    var d = ENT[e] || { klas: '', titel: e, uitleg: '' };
    return '<div class="blok" data-ent="' + esc(e) + '">' +
      '<div class="entkop"><span class="ent ' + d.klas + '">' + esc(e.toUpperCase()) + '</span>' +
        '<h3>' + esc(d.titel) + '</h3></div>' +
      '<p class="duiding">' + esc(d.uitleg) + '</p>' +
      data.lagen.map(function (l) { return laagBlok(e, l); }).join('') +
      '</div>';
  }

  function nieuwVeldBlok() {
    if (!magSchrijven) return '';
    var opties = data.groepen.map(function (g) {
      return '<option value="' + esc(g) + '">' + esc(GROEPNAAM[g] || g) + '</option>';
    }).join('');
    return '<div class="blok"><h3>Een veld erbij</h3>' +
      '<p class="duiding">Het nieuwe veld verschijnt meteen bij elke leverancier, en hierboven als pil. ' +
      'Hij staat nergens aan tot je hem aanzet.</p>' +
      '<form id="nvForm">' +
        '<div class="rij2">' +
          '<label class="veld"><input type="text" id="nvLabel" placeholder=" ">' +
            '<span class="veld-label">Hoe heet het veld?</span></label>' +
          '<label class="veld keuze"><select id="nvGroep">' + opties + '</select>' +
            '<span class="veld-label">In welke groep?</span></label>' +
        '</div>' +
        '<label class="veld"><input type="text" id="nvHulp" placeholder=" ">' +
          '<span class="veld-label">Hulptekst — wat moet iemand invullen?</span></label>' +
        '<label class="vink"><input type="checkbox" id="nvPg"> ' +
          'Dit is een persoonsgegeven</label>' +
        '<p class="duiding" style="margin:0 0 12px">Publiek op te vragen is niet hetzelfde als vrij te publiceren. ' +
        'Een veld met dit vinkje krijgt een stip en kan straks in één regel uit het publieke rapport worden gehouden.</p>' +
        '<p><button type="submit" class="knop prim">Toevoegen</button></p>' +
        '<p class="melding" id="nvMelding" hidden></p>' +
      '</form></div>';
  }

  function teken() {
    if (!token) {
      el('blad').innerHTML = '<h1>Instellingen</h1>' +
        '<p class="sub">Je bent hier niet aangemeld.</p>' +
        '<div class="blok"><p>Deze pagina gebruikt dezelfde sleutel als de admin. ' +
        'Meld je daar aan, dan werkt het hier ook.</p>' +
        '<p style="margin-top:12px"><a class="knop prim" href="admin.html">Naar de admin</a></p></div>';
      return;
    }
    if (blad === 'site') return tekenSite();
    if (blad === 'lagen') return tekenLagen();
    el('blad').innerHTML = '<h1>Bedrijfsgegevens</h1>' +
      '<p class="sub">Welke gegevens we per entiteit willen hebben, en waar ze terechtkomen. ' +
      (magSchrijven ? ''
        : zonderNaam ? 'Er staat geen naam bij je sleutel in deze browser. Meld je opnieuw aan in de admin — elk profiel draagt wie het vastlegde.'
        : 'Je kijkt mee met een leestoken — aanpassen kan niet.') + '</p>' +
      '<div class="blok" style="background:var(--purple-50)">' +
        '<p class="duiding" style="margin:0">De crawler haalt op wat hij kan vinden — dat staat hier niet. ' +
        'Wat je hier zet is wat we ervan <strong>tonen</strong>. Een veld dat je wel wilt weten maar niet ' +
        'wilt laten zien — bestuurders bijvoorbeeld — vink je gewoon nergens aan. ' +
        'Het staat dan in de admin en verder nergens.</p></div>' +
      data.entiteiten.map(entBlok).join('') +
      nieuwVeldBlok();
    bind();
  }

  // --- welke stappen de gratis check draait ---------------------------------
  //
  // Acht onderzoeksstappen, twee zitten er standaard in de gratis check. Dit
  // stond in pipeline.js en was dus een uitrol.
  //
  // LET OP wat hier NIET mee verandert. De score van de gratis check rust op
  // 60% COA en 40% LAB. Een stap erbij kleurt meer categorieën in, maar telt
  // niet mee in dat cijfer. coaDataset of laboratorium UITzetten betekent dat
  // er helemaal geen score meer uitkomt - dat is methodiek en niet zomaar een
  // voorkeur, dus het scherm zegt het, en de knop blijft van Ruben.
  var STAPUITLEG = {
    identiteit: 'Leest de contact-, voorwaarden-, privacy- en over-ons-pagina van de shop. Dit is de stap die adres, KvK en BTW zou kunnen voeden.',
    domein: 'Domeinregistratie, archief en hoe lang de winkel bestaat.',
    coaDataset: 'De labrapporten zelf ophalen en uitlezen. De zwaarste stap, en de basis van alles.',
    laboratorium: 'Naslaan of de labverwijzingen bij het lab oplossen.',
    socialAffiliates: 'Affiliates, kortingscodes en commerciële relaties.',
    reputatie: 'Trustpilot, Reddit en klachten.',
    regelgeving: 'IGJ, NVWA, verkoopverboden en waarschuwingen.',
    tegenbewijs: 'Wat er juist vóór deze partij pleit.'
  };
  var lagen = null, lagenKeuze = null;

  function duurKort(ms, runs) {
    if (!ms) return 'nog niet gemeten';
    var m = Math.round(ms / 60000), s2 = Math.round(ms / 1000);
    return (m >= 1 ? m + ' min' : s2 + ' sec') + ' · ' + runs + ' run' + (runs === 1 ? '' : 's');
  }

  function tekenLagen() {
    if (!lagen) { el('blad').innerHTML = '<h1>Gratis of Deep Dive</h1><p class="leeg">Laden…</p>'; return; }
    var dragend = lagen.dragendeStappen || [];
    var mist = dragend.filter(function (k) { return !lagenKeuze.has(k); });
    var totaal = 0;
    lagen.stappen.forEach(function (st) { if (lagenKeuze.has(st.key) && st.gemiddeldeMs) totaal += st.gemiddeldeMs; });

    var h = '<h1>Gratis of Deep Dive</h1>' +
      '<p class="sub">Welke onderzoeksstappen een bezoeker gratis krijgt. Wat je hier uitzet, draait in de Deep Dive. ' +
      (magDeurDicht ? '' : 'Alleen een beheerder kan dit omzetten.') + '</p>' +
      '<div class="blok" style="background:var(--purple-50)">' +
        '<p class="duiding" style="margin:0">Een stap erbij kost tijd en geld per check, en kleurt meer categorieën in. ' +
        'De <strong>score</strong> verandert er niet van: die rust op 60% COA en 40% lab. ' +
        'De tijden hieronder zijn gemeten over echte runs, niet geschat.</p></div>' +
      '<div class="blok">' +
        lagen.stappen.map(function (st) {
          var aan = lagenKeuze.has(st.key);
          return '<div class="staprij">' +
            '<button type="button" class="pil" aria-pressed="' + aan + '" data-stap="' + esc(st.key) + '"' +
              (magDeurDicht ? '' : ' disabled') + '>' + (aan ? 'gratis' : 'deep') + '</button>' +
            '<span class="wat"><b>' + esc(st.label) +
              (dragend.indexOf(st.key) !== -1 ? '<span class="draagt">de score rust hierop</span>' : '') +
              '</b><span>' + esc(STAPUITLEG[st.key] || '') + '</span></span>' +
            '<span class="duur">' + esc(duurKort(st.gemiddeldeMs, st.runs)) + '</span>' +
            '</div>';
        }).join('') +
        '<p class="waarschuwing" id="lWaarschuw"' + (mist.length ? '' : ' hidden') + '>' +
          (mist.length ? 'Zonder ' + mist.map(function (k) {
            var st = lagen.stappen.filter(function (x) { return x.key === k; })[0];
            return esc(st ? st.label : k);
          }).join(' en ') + ' komt er uit de gratis check geen score meer. Dat kan, maar het is een methodische keuze — leg hem bij Annemarie neer.' : '') +
        '</p>' +
        (magDeurDicht ? '<div class="knoppen">' +
          '<button type="button" class="knop prim" id="lBewaar">Vastleggen</button>' +
          '<button type="button" class="knop sec klein" id="lTerug">Annuleren</button></div>' : '') +
        '<p class="melding" id="lMelding" hidden></p>' +
      '</div>' +
      '<p class="duiding">Samen ongeveer ' + (totaal ? Math.round(totaal / 60000) + ' minuten' : 'onbekend') +
        ' per gratis check, plus de categoriebeoordeling en het samenstellen van het rapport.</p>';
    el('blad').innerHTML = h;
    if (!magDeurDicht) return;

    Array.prototype.forEach.call(document.querySelectorAll('[data-stap]'), function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-stap');
        if (lagenKeuze.has(k)) lagenKeuze.delete(k); else lagenKeuze.add(k);
        tekenLagen();
      });
    });
    document.getElementById('lTerug').addEventListener('click', function () {
      lagenKeuze = new Set(lagen.stappen.filter(function (st) { return st.inGratis; })
        .map(function (st) { return st.key; }));
      tekenLagen();
    });
    document.getElementById('lBewaar').addEventListener('click', function () {
      var b = document.getElementById('lBewaar');
      b.disabled = true;
      haal('/api/admin/lagen', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stappen: Array.prototype.slice.call(lagenKeuze), door: naam })
      }).then(function (j) {
        lagen.stappen.forEach(function (st) { st.inGratis = (j.stappen || []).indexOf(st.key) !== -1; });
        tekenLagen();
        melding('lMelding', 'Vastgelegd. Dit geldt vanaf de eerstvolgende check.');
      }).catch(function (err) {
        melding('lMelding', 'Mislukt: ' + err.message, true); b.disabled = false;
      });
    });
  }

  // --- de site live of offline ---------------------------------------------
  //
  // Dezelfde schakelaar als in de kopbalk van de admin, maar hier staat ook het
  // ZINNETJE dat een bezoeker dan leest. Dat kon de server al sinds de eerste
  // versie; er was alleen nergens een veld voor, dus stond er altijd de
  // standaardtekst.
  //
  // LET OP wat dicht WEL en NIET is. Dicht betekent dat de server een
  // startende check van een bezoeker weigert. De pagina zelf blijft gewoon op
  // te halen - een knop verbergen is geen afsluiten, alleen het weigeren aan
  // de serverkant is dat.
  function tekenSite() {
    var open = stand && stand.publiekeCheck === true;
    var onbekend = !stand;
    var h = '<h1>Live of offline</h1>' +
      '<p class="sub">Of een bezoeker een check kan starten, en wat hij leest als dat niet kan. ' +
      (magDeurDicht ? '' : 'Alleen een beheerder kan dit omzetten.') + '</p>' +
      '<div class="blok">' +
        '<div class="standrij">' +
          '<button type="button" class="stand-knop' + (onbekend ? ' onbekend' : (open ? '' : ' uit')) +
            '" id="sKnop" aria-pressed="' + (!!open) + '"' + (magDeurDicht && !onbekend ? '' : ' disabled') + '>' +
            '<span class="bol" aria-hidden="true"></span>' +
            '<span>' + (onbekend ? 'onbekend' : (open ? 'Live' : 'Offline')) + '</span></button>' +
          '<span class="duiding" style="margin:0">' +
            (onbekend ? 'De stand is niet op te halen.'
              : open ? 'Bezoekers kunnen een check starten.'
                     : 'De server weigert een startende check. De pagina blijft bereikbaar.') +
            '</span>' +
        '</div>' +
        (stand && stand.door ? '<p class="duiding" style="margin:0 0 16px">Laatst omgezet door ' +
          esc(stand.door) + '.</p>' : '') +
        '<label class="veld"><textarea id="sBericht" rows="3" placeholder=" ">' +
          esc((stand && stand.bericht) || '') + '</textarea>' +
          '<span class="veld-label">Wat een bezoeker leest als de check dicht is</span></label>' +
        '<p class="veld-hulp">Zeg wat er aan de hand is en wanneer het weer kan. ' +
        'Laat je dit leeg, dan staat er de standaardtekst.</p>' +
        (magDeurDicht ? '<div class="knoppen">' +
          '<button type="button" class="knop prim" id="sBewaar">Zinnetje vastleggen</button></div>' : '') +
        '<p class="melding" id="sMelding" hidden></p>' +
      '</div>';
    el('blad').innerHTML = h;
    if (!magDeurDicht) return;

    function zet(nieuwOpen, bericht) {
      return haal('/api/admin/stand', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ open: nieuwOpen, bericht: bericht, door: naam })
      }).then(function (j) { stand = j; tekenSite(); });
    }

    var k = document.getElementById('sKnop');
    if (k) k.addEventListener('click', function () {
      k.disabled = true;
      zet(!open, document.getElementById('sBericht').value.trim())
        .catch(function (err) { melding('sMelding', 'Mislukt: ' + err.message, true); k.disabled = false; });
    });
    var b = document.getElementById('sBewaar');
    if (b) b.addEventListener('click', function () {
      b.disabled = true;
      // De stand zelf blijft wat hij is: dit legt alleen de tekst vast.
      zet(!!open, document.getElementById('sBericht').value.trim())
        .catch(function (err) { melding('sMelding', 'Mislukt: ' + err.message, true); })
        .then(function () { b.disabled = false; });
    });
  }

  function melding(id, tekst, fout) {
    var p = document.getElementById(id);
    if (!p) return;
    p.textContent = tekst; p.hidden = false;
    p.className = 'melding' + (fout ? ' fout' : '');
  }

  function bind() {
    Array.prototype.forEach.call(document.querySelectorAll('.pil'), function (b) {
      if (!magSchrijven) { b.disabled = true; return; }
      b.addEventListener('click', function () {
        var e = b.getAttribute('data-e'), l = b.getAttribute('data-l'), v = b.getAttribute('data-v');
        var s = keuze[e][l];
        if (s.has(v)) s.delete(v); else s.add(v);
        b.setAttribute('aria-pressed', String(s.has(v)));
        var tel = document.querySelector('[data-tel="' + e + ':' + l + '"]');
        if (tel) tel.textContent = s.size + ' van ' + data.velden.length;
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-klap]'), function (b) {
      b.addEventListener('click', function () {
        var k = b.getAttribute('data-klap');
        open[k] = !open[k];
        b.setAttribute('aria-expanded', String(!!open[k]));
        var lijf = document.getElementById('lijf-' + k);
        if (lijf) lijf.hidden = !open[k];
      });
    });

    Array.prototype.forEach.call(document.querySelectorAll('[data-bewaar]'), function (b) {
      b.addEventListener('click', function () {
        var deel = b.getAttribute('data-bewaar').split(':');
        var e = deel[0], l = deel[1], id = 'm-' + e + '-' + l;
        b.disabled = true;
        // De server VERVANGT de hele lijst van deze laag. Half opsturen zou
        // dus half uitzetten betekenen; daarom gaat de complete selectie mee.
        haal('/api/admin/velden/profiel', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ entiteit: e, laag: l,
            velden: Array.prototype.slice.call(keuze[e][l]), door: naam })
        }).then(function () {
          if (!data.profielen[e]) data.profielen[e] = {};
          data.profielen[e][l] = Array.prototype.slice.call(keuze[e][l]);
          melding(id, 'Vastgelegd.');
        }).catch(function (err) {
          melding(id, 'Mislukt: ' + err.message, true);
        }).then(function () { b.disabled = false; });
      });
    });

    // Annuleren zet ALLEEN deze laag terug naar wat er is opgeslagen. Een
    // knop die ook de laag ernaast terugdraait zou verrassen.
    Array.prototype.forEach.call(document.querySelectorAll('[data-herstel]'), function (b) {
      b.addEventListener('click', function () {
        var deel = b.getAttribute('data-herstel').split(':');
        var e = deel[0], l = deel[1];
        keuze[e][l] = new Set(((data.profielen[e] || {})[l]) || []);
        teken();
      });
    });

    var f = document.getElementById('nvForm');
    if (f) f.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var label = document.getElementById('nvLabel').value.trim();
      if (label.length < 2) { melding('nvMelding', 'Geef het veld een naam.', true); return; }
      haal('/api/admin/velden', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: label,
          groep: document.getElementById('nvGroep').value,
          hulp: document.getElementById('nvHulp').value.trim(),
          persoonsgegeven: document.getElementById('nvPg').checked, door: naam })
      }).then(function () { return laden(); })
        .catch(function (err) { melding('nvMelding', 'Mislukt: ' + err.message, true); });
    });
  }

  function laden() {
    return haal('/api/admin/wie-ben-ik').then(function (j) {
      // Aanpassen is redactiewerk, net als een labstand vastleggen. Een lezer
      // ziet de pagina wel: weten wat er is ingesteld is geen schrijfrecht.
      // magBeoordelen en niet de rolnaam: de server rekent dat al uit, en een
      // tweede lijstje rolnamen hier zou bij een nieuwe rol stil achterlopen.
      //
      // ZONDER NAAM GEEN SCHRIJFRECHT. Elk oordeel in dit systeem draagt wie
      // het vastlegde; een profiel zonder naam zou de enige uitzondering zijn.
      // De naam komt uit het aanmelden in de admin.
      magSchrijven = !!(j && j.magBeoordelen) && !!naam;
      zonderNaam = !!(j && j.magBeoordelen) && !naam;
      // De deur voor de buitenwereld dichtdoen mag alleen de BEHEERDER. Een
      // beoordelaar legt oordelen vast; dat is iets anders dan de site uitzetten.
      magDeurDicht = !!(j && j.rol === 'beheerder');
      return Promise.all([
        haal('/api/admin/velden'),
        // De STAFROUTE en niet /api/stand: die stuurt het zinnetje alleen mee
        // als de check dicht is, en dan zou je hier een leeg veld bewerken en
        // de tekst bij het opslaan onbedoeld op de standaard zetten.
        haal('/api/admin/stand').catch(function () { return null; }),
        haal('/api/admin/lagen').catch(function () { return null; })
      ]);
    }).then(function (paar) {
      var j = paar[0];
      stand = paar[1];
      lagen = paar[2];
      if (lagen && lagen.stappen) {
        lagenKeuze = new Set(lagen.stappen.filter(function (st) { return st.inGratis; })
          .map(function (st) { return st.key; }));
      }
      data = { velden: j.velden || [], profielen: j.profielen || {},
        groepen: j.groepen || [], entiteiten: j.entiteiten || [], lagen: j.lagen || [] };
      laadKeuze();
      teken();
    }).catch(function (e) {
      el('blad').innerHTML = '<h1>Instellingen</h1><p class="fout">Ophalen mislukt: ' +
        esc(e.message) + '</p>';
    });
  }

  Array.prototype.forEach.call(document.querySelectorAll('#zijmenu [data-blad]'), function (b) {
    b.addEventListener('click', function () {
      blad = b.getAttribute('data-blad');
      Array.prototype.forEach.call(document.querySelectorAll('#zijmenu [data-blad]'), function (a) {
        a.setAttribute('aria-current', String(a === b));
      });
      teken();
    });
  });

  if (!token) teken(); else laden();
})();
</script>
