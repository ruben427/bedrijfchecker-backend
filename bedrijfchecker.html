<!DOCTYPE html>
<meta charset="utf-8">
<title>Bedrijfchecker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Buiten .wrap, want het paneel ligt over de hele pagina en mag niet
     verdwijnen bij een re-render van #app. -->
<div id="sheet-root"></div>

<script>
(function(){

  // Losse, publiek gehoste backend (Node/Express + Postgres + Anthropic +
  // Tavily) die de volledige research/scoring/synthese-pipeline server-side
  // draait. Deze frontend praat er alleen nog met fetch() tegenaan — geen
  // window.claude-capabilities (db/mcp/sample/assets) meer nodig, dus dit
  // werkt voor iedere bezoeker, ook zonder Claude-account.
  var API_BASE = 'https://bedrijfchecker-backend-production.up.railway.app';

  // ---------- app state ----------
  var state = {
    view: 'dashboard',      // dashboard | detail
    cases: [],
    casesLoaded: false,
    apiError: null,
    currentCaseId: null,
    currentCase: null,
    startDraft: { website:'' },
    startFiles: [],          // {file: File, kind: 'image'|'other'}
    startUploadOpen: false,  // documenten-uploadvak: standaard ingeklapt, caret naar links
    startKvkFile: null,      // apart, want gaat naar de identiteitsstap i.p.v. de COA-stap
    startUrlError: null,
    startEigenCoaUrl: '',    // link naar het certificaat dat de koper zelf kreeg
    startEigenCoaFiles: [],  // idem, maar als bestand (PDF of foto)
    startEigenCoaError: null,
    startEigenCoaOpen: false,
    runningCaseIds: {},      // caseId (of '__new__') -> true terwijl er een create/retry-call onderweg is
    runningStepKeys: {}      // caseId -> key van de stap die nu via "opnieuw" wordt herdraaid (voor renderProgress)
  };

  var stepStats = {};        // nog geen live-stats-endpoint op de backend; avgForStep valt terug op DEFAULT_STEP_MS
  var casePoller = null;     // herhaalt GET /api/audits/:id zolang een case 'bezig' is

  var app = document.getElementById('app');
  var banner = document.getElementById('capability-banner');

  // Scherpgestelde FREE/DEEP-knip (14 sep): gratis draait alleen de COA-stap
  // + laboratorium (precies wat de Free Evidence Score ook gebruikt: 60% COA
  // + 40% LAB). De COA-stap gaat voorop: die leest de rapporten, en de
  // laboratoriumstap onderzoekt de labs die daarop blijken te staan. Alle overige stappen hieronder
  // (identiteit, domein, social/affiliates, reputatie, regelgeving,
  // tegenbewijs) zijn Deep-scope en draaien pas na een bewuste "ga door"-klik
  // op de betaalde Deep Dive — nog zonder betaalstraat ervoor.
  var FREE_STEP_KEYS = ['coaDataset', 'laboratorium'];
  var DEEP_STEP_KEYS = ['identiteit', 'domein', 'socialAffiliates', 'reputatie', 'regelgeving', 'tegenbewijs'];
  var STEP_DEFS = [
    { key:'identiteit', label:'Juridische identiteit' },
    { key:'domein', label:'Domein- en websitegeschiedenis' },
    { key:'coaDataset', label:'COA-dataset en -authenticiteit' },
    { key:'laboratorium', label:'Laboratorium' },
    { key:'socialAffiliates', label:'Social media, affiliates en commerciële relaties' },
    { key:'reputatie', label:'Reputatie' },
    { key:'regelgeving', label:'Regelgeving en toezicht' },
    { key:'tegenbewijs', label:'Tegenbewijs en positieve signalen' },
    // LET OP: dit getal komt uit CATEGORY_DEFS in src/scoringEngine.js. Deze
    // pagina kan die lijst niet lezen, dus bij een nieuwe categorie moet het
    // hier met de hand mee.
    { key:'categorize', label:'Categoriebeoordeling (18 categorieën)' },
    { key:'reportA', label:'Evidence Check samenstellen (1/2)' },
    { key:'reportB', label:'Evidence Check samenstellen (2/2)' }
  ];
  var DEFAULT_STEP_MS = 45000; // fallback average tot er een live-stats-endpoint is
  function stepLabel(key){
    for (var i=0;i<STEP_DEFS.length;i++) if (STEP_DEFS[i].key===key) return STEP_DEFS[i].label;
    return key;
  }
  function avgForStep(key){
    var s = stepStats && stepStats[key];
    return (s && s.avgMs) || DEFAULT_STEP_MS;
  }
  var AFRONDSTAPPEN = ['categorize', 'reportA', 'reportB'];
  // De stappenlijst tijdens een run. Bij een Deep Dive is dat niet alleen de
  // deep-stappen: de gebruiker heeft de gratis run net zien draaien en moet
  // die bovenaan terugzien staan, precies zoals in het design.
  function runRijenVoorCase(c){
    function rijen(keys, fase){
      return STEP_DEFS.filter(function(s){ return keys.indexOf(s.key) !== -1; })
        .map(function(s){ return { key:s.key, label:s.label, fase:fase }; });
    }
    var gratis = rijen(FREE_STEP_KEYS.concat(AFRONDSTAPPEN), 'gratis');
    if (c.tier !== 'deep') return gratis;
    return gratis.concat(rijen(DEEP_STEP_KEYS.concat(AFRONDSTAPPEN), 'deep'));
  }

  function isStuck(c){
    if (c.status !== 'bezig' || !c.currentStep) return false;
    var threshold = Math.max(avgForStep(c.currentStep.key) * 2.5, 60000);
    return (Date.now() - c.currentStep.startedAt) > threshold;
  }

  // ---------- categorie-indeling (Supplier Evidence Scoring & Result Logic
  // v1.0) ----------
  // De kleuren/scores zelf worden nu volledig server-side berekend (zie
  // src/scoringEngine.js in de backend, 1-op-1 dezelfde deterministische
  // logica); hier staat alleen de indeling die nodig is om
  // engineResult.assessments overzichtelijk te groeperen bij het renderen.
  var CATEGORY_DEFS = [
    { id:'C01', pillar:'COA', label:'COA-authenticiteit' },
    { id:'C02', pillar:'COA', label:'Identity' },
    { id:'C03', pillar:'COA', label:'Purity' },
    { id:'C04', pillar:'COA', label:'Quantity' },
    { id:'C05', pillar:'COA', label:'Batchtraceerbaarheid' },
    { id:'C06', pillar:'COA', label:'Sample→COA' },
    { id:'C07', pillar:'COA', label:'Sterility' },
    { id:'C08', pillar:'COA', label:'Endotoxin' },
    { id:'C09', pillar:'COA', label:'Overige contaminantentests' },
    // A19 (Annemarie, 21 september): zware metalen uit C09 gehaald en een
    // eigen categorie gegeven. Achttien in plaats van zeventien.
    { id:'C10', pillar:'COA', label:'Zware metalen' },
    { id:'L01', pillar:'LAB', label:'Lab' },
    { id:'B01', pillar:'COMPANY', label:'Juridische transparantie' },
    { id:'B02', pillar:'COMPANY', label:'Eigenaren/bestuurders' },
    { id:'B03', pillar:'COMPANY', label:'Bedrijfshistorie' },
    { id:'B04', pillar:'COMPANY', label:'Domein/websitehistorie' },
    { id:'B05', pillar:'COMPANY', label:'Regelgeving/toezicht' },
    { id:'R01', pillar:'REPUTATION', label:'Reputatie' },
    { id:'R02', pillar:'REPUTATION', label:'Affiliate/commerciële transparantie' }
  ];
  var PILLARS = ['COA','LAB','COMPANY','REPUTATION'];
  function categoryDef(id){
    for (var i=0;i<CATEGORY_DEFS.length;i++) if (CATEGORY_DEFS[i].id===id) return CATEGORY_DEFS[i];
    return null;
  }
  function pillarCategoryIds(pillar){
    return CATEGORY_DEFS.filter(function(c){ return c.pillar===pillar; }).map(function(c){ return c.id; });
  }

  // ---------- helpers ----------
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function normalizeUrl(input){
    var s = (input||'').trim();
    if(!s) return '';
    if(!/^https?:\/\//i.test(s)) s = 'https://' + s;
    return s;
  }
  function domainOf(url){
    try { return new URL(url).hostname.replace(/^www\./,''); } catch(e){ return url; }
  }
  // Client-side check dat het ingevoerde veld een geldige web-URL kan zijn
  // (na eventueel https:// voorvoegen). Gebruikt vóór het aanmaken van een
  // case; de backend valideert exact dezelfde regel nogmaals server-side
  // (src/validate.js) en geeft anders 400 invalid_url terug.
  function isValidWebUrl(input){
    var s = (input||'').trim();
    if (!s) return false;
    var withScheme = /^https?:\/\//i.test(s) ? s : 'https://' + s;
    try {
      var u = new URL(withScheme);
      if (!/^https?:$/.test(u.protocol)) return false;
      var host = u.hostname;
      if (!host || host.indexOf('.') === -1) return false;
      return /^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$/i.test(host);
    } catch(e){ return false; }
  }
  function fmtDate(ts){
    try { return new Date(ts).toLocaleDateString('nl-NL', {day:'numeric', month:'short', year:'numeric'}); }
    catch(e){ return ''; }
  }
  function fmtDateLang(ts){
    try { return new Date(ts).toLocaleDateString('nl-NL', {day:'numeric', month:'long', year:'numeric'}); }
    catch(e){ return ''; }
  }
  function fmtDuration(ms){
    if (ms == null || isNaN(ms)) return '';
    var s = Math.max(0, Math.round(ms/1000));
    if (s < 60) return '~' + s + 's';
    var m = Math.floor(s/60), r = s%60;
    return '~' + m + 'm' + (r ? ' ' + r + 's' : '');
  }
  // Kleurmapping voor de 18 vaste categorieën (Supplier Evidence Scoring &
  // Result Logic v1.0): green/orange/red/white, nooit de oude groen/oranje/
  // rood/grijs-scorekaart-strings.
  function catColorClass(color){
    if (color === 'green') return 'ok';
    if (color === 'orange') return 'warn';
    if (color === 'red') return 'danger';
    return 'grey';
  }
  function catColorLabel(color){
    if (color === 'green') return 'Geslaagd';
    if (color === 'orange') return 'Aandachtspunt';
    if (color === 'red') return 'Aangetoond probleem';
    return 'Onvoldoende informatie';
  }

  // ---------- API-client (vervangt de Artifact's window.claude db/mcp/sample-
  // capabilities) ----------
  // ---------- Owner token ----------
  // De backend koppelt elke case aan de browser die hem aanmaakte. Deze browser
  // houdt daarvoor één willekeurig token in localStorage; de server bewaart
  // alleen de hash ervan. Zonder dit token geeft de API niets terug.
  //
  // LET OP: wie dit token kwijtraakt (andere browser, localStorage gewist),
  // ziet zijn eerdere audits niet meer. Dat is de prijs van geen login.
  var OWNER_TOKEN_KEY = "bedrijfchecker.ownerToken";
  function ownerToken(){
    var t = null;
    try { t = localStorage.getItem(OWNER_TOKEN_KEY); } catch(e){}
    if (t && t.length >= 32) return t;
    var bytes = new Uint8Array(32);
    (window.crypto || window.msCrypto).getRandomValues(bytes);
    t = btoa(String.fromCharCode.apply(null, bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    try { localStorage.setItem(OWNER_TOKEN_KEY, t); } catch(e){}
    return t;
  }
  function apiFetch(path, opts){
    opts = opts || {};
    var headers = Object.assign({}, opts.headers || {}, { "X-Owner-Token": ownerToken() });
    return fetch(API_BASE + path, Object.assign({}, opts, { headers: headers }));
  }

  async function apiListCases(){
    var res = await apiFetch('/api/audits');
    if (!res.ok) throw new Error('Kon eerdere audits niet laden (' + res.status + ')');
    var data = await res.json();
    return data.cases || [];
  }
  async function apiGetCase(id){
    var res = await apiFetch('/api/audits/' + encodeURIComponent(id));
    if (res.status === 404) return null;
    if (!res.ok) throw new Error('Kon deze audit niet laden (' + res.status + ')');
    var data = await res.json();
    return data.case || null;
  }
  async function apiCreateCase(fields, files, kvkFile, eigenCoa){
    var fd = new FormData();
    fd.append('website', fields.website);
    if (fields.naam) fd.append('naam', fields.naam);
    if (fields.land) fd.append('land', fields.land);
    if (fields.kvkNummer) fd.append('kvkNummer', fields.kvkNummer);
    if (fields.notities) fd.append('notities', fields.notities);
    (files||[]).forEach(function(f){ fd.append('files', f); });
    if (kvkFile) fd.append('kvkDocument', kvkFile);
    // Het eigen certificaat van de koper. Apart veld, niet bij 'files': het
    // gaat over zijn batch, niet over de openheid van de winkel.
    if (eigenCoa){
      if (eigenCoa.url) fd.append('eigenCoaUrl', eigenCoa.url);
      (eigenCoa.files||[]).forEach(function(f){ fd.append('eigenCoa', f); });
    }
    var res = await apiFetch('/api/audits', { method:'POST', body: fd });
    var data = await res.json().catch(function(){ return {}; });
    if (!res.ok){
      var err = new Error(data.message || data.error || 'Aanmaken van de audit is mislukt (' + res.status + ')');
      err.code = data.error;
      // Bij een doorgelinkt adres stuurt de server het adres mee waar de check
      // wel kan (besluit Ruben 23 sep, taak raccoonpeptides.com).
      err.doorgelinktNaar = data.doorgelinktNaar || null;
      throw err;
    }
    return data.case;
  }
  async function apiStopCase(id){
    var res = await apiFetch('/api/audits/' + encodeURIComponent(id) + '/stop', { method:'POST' });
    var data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || 'Stoppen is mislukt (' + res.status + ')');
    return data.case;
  }
  async function apiRetryStep(id, key){
    var res = await apiFetch('/api/audits/' + encodeURIComponent(id) + '/retry-step', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ key: key })
    });
    var data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.error || 'Opnieuw proberen is mislukt (' + res.status + ')');
    return data.case;
  }
  async function apiRerunCase(id){
    var res = await apiFetch('/api/audits/' + encodeURIComponent(id) + '/rerun', { method:'POST' });
    var data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.message || data.error || 'Opnieuw draaien is mislukt (' + res.status + ')');
    return data.case;
  }
  async function apiContinueDeep(id){
    var res = await apiFetch('/api/audits/' + encodeURIComponent(id) + '/continue-deep', { method:'POST' });
    var data = await res.json().catch(function(){ return {}; });
    if (!res.ok) throw new Error(data.message || data.error || 'Starten van de Deep Dive is mislukt (' + res.status + ')');
    return data.case;
  }

  function renderBanner(){
    // Een check hoort bij de browser die hem startte - er is geen login. Komt
    // hij niet terug, dan is dat geen netwerkstoring en moet er iets anders
    // staan dan "probeer te verversen", want verversen helpt hier nooit.
    if (state.eigenaarFout){
      banner.innerHTML = '<div class="banner danger">Deze check hoort niet bij deze browser. ' +
        'Er is geen account: een check is alleen zichtbaar in de browser waarin hij is gestart. ' +
        'Start hem hier opnieuw, of open hem in de browser waarin je hem begon.</div>';
      return;
    }
    if (!state.apiError){ banner.innerHTML=''; return; }
    banner.innerHTML = '<div class="banner danger">Kan geen verbinding maken met de Bedrijfchecker-server: ' + escapeHtml(state.apiError) + '. Probeer de pagina te verversen.</div>';
  }

  // ---------- init ----------
  async function initApp(){
    try {
      state.cases = await apiListCases();
      state.apiError = null;
    } catch(e){
      state.apiError = e.message;
    }
    state.casesLoaded = true;
    renderBanner();
    render();
  }

  // ---------- routing / render ----------
  function stopCasePoller(){
    if (casePoller){ clearInterval(casePoller); casePoller = null; }
  }
  function ensureCasePoller(id){
    stopCasePoller();
    casePoller = setInterval(function(){
      if (state.view !== 'detail' || state.currentCaseId !== id){ stopCasePoller(); return; }
      apiGetCase(id).then(function(c){
        if (state.currentCaseId !== id) return;
        // null = 404. Blijven pollen heeft dan geen zin: dit wordt nooit iets.
        // Hier stond 'if (!c) return', en dat was precies het stille vastlopen
        // - elke vier seconden niets, zonder enig teken aan de gebruiker.
        if (!c){ stopCasePoller(); state.eigenaarFout = true; renderBanner(); return; }
        state.currentCase = c;
        render();
        if (c.status !== 'bezig') stopCasePoller();
      }).catch(function(){ /* netwerkhikje: gewoon volgende tik opnieuw proberen */ });
    }, 4000);
  }
  function goDashboard(){
    stopCasePoller();
    state.view='dashboard'; state.currentCaseId=null; state.currentCase=null;
    state.eigenaarFout = false;
    state.startDraft = { website:'' };
    state.startFiles = [];
    state.startUploadOpen = false;
    state.startKvkFile = null;
    state.startUrlError = null;
    render();
    apiListCases().then(function(cases){
      state.cases = cases; state.apiError = null; renderBanner();
      if (state.view==='dashboard') render();
    }).catch(function(e){ state.apiError = e.message; renderBanner(); });
  }
  function goDetail(id){
    state.view='detail'; state.currentCaseId=id;
    state.currentCase = state.cases.find(function(c){ return c.id===id; }) || null;
    render();
    apiGetCase(id).then(function(c){
      if (state.currentCaseId !== id) return;
      if (!c){ state.eigenaarFout = true; renderBanner(); return; }
      state.eigenaarFout = false;
      state.currentCase = c;
      render();
      if (c.status === 'bezig') ensureCasePoller(id);
    }).catch(function(e){ if (state.currentCaseId === id && !state.currentCase) alert('Kon deze audit niet laden: ' + e.message); });
  }

  function render(){
    if (state.view === 'dashboard') return renderDashboard();
    if (state.view === 'detail') return renderDetail();
  }

  // ---------- icons (inline SVG, geen externe iconfont nodig) ----------
  var ICON_CARET = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
  var ICON_SEARCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>';
  var ICON_UPLOAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="13" x2="12" y2="19"/><line x1="9" y1="16" x2="15" y2="16"/></svg>';
  var ICON_CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>';
  var ICON_CHEVRON_LEFT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg>';
  var ICON_STEP_DONE = '<svg viewBox="0 0 21 21" width="21" height="21"><circle cx="10.5" cy="10.5" r="10.5" fill="var(--ok)"/><path d="M6 10.7l3 3 6-6.8" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  // ---------- dashboard (landingspagina: direct starten + eerder gedraaide audits) ----------
  // Naar het ontwerp van Anne's designsysteem in Figma: geen aparte wizard-stap
  // meer, alles staat direct op de landingspagina. Het documenten-uploadvak
  // staat standaard ingeklapt (caret naar links) en opent pas na een klik.
  function renderDashboard(){
    if (!state.casesLoaded){
      app.innerHTML = '<p style="color:var(--text-muted)">Cases laden…</p>';
      return;
    }
    var d = state.startDraft;
    var starting = !!state.runningCaseIds['__new__'];

    // Hero: naar Anne's designsysteem in Figma ("Checker design", 14 sep) —
    // geen kaartwrapper meer, eyebrow + grote kop + subtekst + formulier
    // direct op de paginaondergrond. De documenten/KvK-uploads onder het
    // formulier zijn eruit (15 sep, op Ruben's verzoek na livecheck) — de
    // gratis check gebruikt toch geen uploads ("Geen account, geen upload"
    // in de tagline klopte tot dan niet helemaal met wat er nog stond); COA-
    // upload blijft exclusief voor de betaalde Deep Dive.
    var hero = '<section class="hero">' +
      '<span class="eyebrow">Gratis Check</span>' +
      '<h1>Weet binnen twee minuten of het bewijs klopt.</h1>' +
      '<p class="hero-tag">Geen account. Heb je zelf een certificaat bij je bestelling gekregen? Stuur het mee, dan kijken we ook naar jouw batch.</p>' +
      '</section>';

    var heroForm = '<div class="hero-form">' +
      '<div class="check-form">' +
        '<div class="veld' + (state.startUrlError?' has-error':'') + '">' +
          '<input type="text" id="f-website" value="' + escapeHtml(d.website) + '" placeholder="Website URL" autofocus>' +
        '</div>' +
        (state.startUrlError ? '<div class="field-error" style="margin-top:6px;">' + escapeHtml(state.startUrlError) + '</div>' : '') +
        eigenCoaVak() +
        '<button type="button" class="btn-cta" id="wiz-start" ' + (starting ? 'disabled' : '') + '>' + ICON_SEARCH + '<span>' + (starting ? 'Starten…' : 'Start gratis check') + '</span></button>' +
      '</div>' +
      '<p class="hero-form-note">Werkt op elke peptide leveranciers-website en duurt enkele minuten om te draaien.</p>' +
      '</div>';

    // Eerder gedraaide checks. Deze lijst is bij het herontwerp van de home
    // (commit 403dfa6) meegesneuveld terwijl de klikafhandeling eronder bleef
    // staan; hier komt hij terug in de opmaak die de CSS al had.
    var eerder = '';
    if (state.cases && state.cases.length){
      var rijen = state.cases.map(function(c){
        var chip = '<span class="chip grey">Nieuw</span>';
        if (c.status === 'bezig') chip = '<span class="chip warn"><span class="spinner"></span> Bezig</span>';
        else if (c.status === 'fout') chip = '<span class="chip danger">Fout</span>';
        else if (c.status === 'gestopt') chip = '<span class="chip grey">Gestopt</span>';
        else if (c.status === 'klaar' || c.status === 'gratis_klaar'){
          var vlaggen = (c.report && c.report.rodeVlaggen && c.report.rodeVlaggen.length) || 0;
          var es = c.engineResult && c.engineResult.evidenceScore;
          if (vlaggen > 0) chip = '<span class="chip danger">' + vlaggen + ' rode vlag' + (vlaggen === 1 ? '' : 'gen') + '</span>';
          else if (es && es.published) chip = '<span class="chip ok">Evidence Score ' + es.value + '</span>';
          else if (c.engineResult && c.engineResult.gate && c.engineResult.gate.code === 'LAB_NOT_VERIFIABLE') chip = '<span class="chip warn">Lab niet verifieerbaar</span>';
          else if (c.engineResult && c.engineResult.gate && c.engineResult.gate.code === 'KOPPELING_NIET_VASTGESTELD') chip = '<span class="chip warn">Koppeling niet vastgesteld</span>';
          else if (c.engineResult && c.engineResult.gate && (c.engineResult.gate.code === 'NO_COA_FOUND' || c.engineResult.gate.code === 'COA_ACCESS_OR_PARSE_BLOCKED')) chip = '<span class="chip grey">Geen bruikbare COA</span>';
          // LET OP: dit is de laatste tak, dus alles wat hierboven niet is
          // afgevangen komt hier terecht. 'Geen rode vlaggen' is groen en leest
          // als een goedkeuring; een case die om een andere reden geen score
          // haalt hoort daar niet te belanden. Op 20 september stond
          // peptidekliniek.nl zo op groen met dertig rapporten van een lab dat
          // niemand kan verifieren.
          else if (c.engineResult && c.engineResult.gate && c.engineResult.gate.status === 'FAIL') chip = '<span class="chip warn">Niet beoordeeld</span>';
          else chip = '<span class="chip ok">Geen rode vlaggen</span>';
          if (c.status === 'gratis_klaar') chip += ' <span class="chip grey">Gratis</span>';
          else if (c.tier === 'deep') chip += ' <span class="chip grey">Deep Dive</span>';
        }
        return '<button type="button" class="audit-row" data-id="' + escapeHtml(c.id) + '">' +
          '<span class="left"><span class="name">' + escapeHtml(c.naam || c.website) + '</span>' +
          '<span class="domain">' + escapeHtml(domainOf(normalizeUrl(c.website))) + '</span>' + chip + '</span>' +
          '<span class="right"><span class="date">' + fmtDate(c.createdAt) + '</span>' +
          '<span class="chev">' + ICON_CHEVRON + '</span></span>' +
          '</button>';
      }).join('');
      eerder = '<section class="report-block"><h3>Eerder gedraaide checks</h3>' +
        '<div class="card"><div class="audit-list">' + rijen + '</div></div></section>';
    }

    // 3-staps-ladder: exact de tekst uit Anne's Figma-ontwerp. "Details"-links

  // Het eigen certificaat van de koper. Dichtgeklapt is het een tekstlink;
  // open staat er een veld met de link en, binnen dezelfde omlijning,
  // "Bestand kiezen" rechts.
  //

  // de kopers heeft een PDF in de mail, het andere een link van de verkoper.
  function eigenCoaVak(){
    var open = state.startEigenCoaOpen || !!state.startEigenCoaUrl || state.startEigenCoaFiles.length > 0;
    var namen = state.startEigenCoaFiles.map(function(f){ return f.name; }).join(', ');

  function wireDashboardEvents(){
    var websiteInput = app.querySelector('#f-website');
    if (websiteInput){
      websiteInput.addEventListener('input', function(){
        state.startDraft.website = websiteInput.value;
        if (state.startUrlError){
          state.startUrlError = null;
          websiteInput.classList.remove('has-error');
          var err = app.querySelector('.field-error');
          if (err) err.remove();
        }
      });
      websiteInput.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); startAudit(); } });
    }

    // Documenten-/KvK-upload uit de gratis hero verwijderd (15 sep) — zie
    // renderDashboard(). apiCreateCase() krijgt hierdoor altijd een lege
    // files-lijst en geen kvkFile mee; dat is prima, want beide waren toch
    // al COA/Deep-Dive-scope.

    var coaToggle = app.querySelector('#coa-toggle');
    if (coaToggle){
      coaToggle.addEventListener('click', function(){
        state.startEigenCoaOpen = !(coaToggle.getAttribute('aria-expanded') === 'true');
        renderDashboard();
        if (state.startEigenCoaOpen){
          var v = app.querySelector('#f-eigen-coa-url');
          if (v) v.focus();
        }
      });
    }

    var coaUrl = app.querySelector('#f-eigen-coa-url');
    if (coaUrl){
      coaUrl.addEventListener('input', function(){
        state.startEigenCoaUrl = coaUrl.value;
        if (state.startEigenCoaError){ state.startEigenCoaError = null; }
      });
      coaUrl.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); startAudit(); } });
    }
    var coaFile = app.querySelector('#f-eigen-coa-file');
    if (coaFile){
      coaFile.addEventListener('change', function(){
        state.startEigenCoaFiles = Array.prototype.slice.call(coaFile.files || []).slice(0, 3);
        renderDashboard();
      });
    }
    var coaWis = app.querySelector('#eigen-coa-wis');
    if (coaWis){
      coaWis.addEventListener('click', function(){ state.startEigenCoaFiles = []; renderDashboard(); });
    }

    var start = app.querySelector('#wiz-start');
    if (start) start.addEventListener('click', startAudit);

    Array.prototype.forEach.call(app.querySelectorAll('.audit-row'), function(btn){
      btn.addEventListener('click', function(){ goDetail(btn.getAttribute('data-id')); });
    });
  }

  async function startAudit(){
    if (state.runningCaseIds['__new__']) return;
    var raw = state.startDraft.website;
    if (!isValidWebUrl(raw)){
      state.startUrlError = 'Vul een geldige web URL in.';
      renderDashboard();
      var input = app.querySelector('#f-website');
      if (input) input.focus();
      return;
    }
    var website = normalizeUrl(raw);
    var files = state.startFiles.map(function(f){ return f.file; });
    state.runningCaseIds['__new__'] = true;
    renderDashboard();
    try {
      var created = await apiCreateCase(
        { naam: domainOf(website), website: website },
        files, state.startKvkFile,
        { url: (state.startEigenCoaUrl || '').trim(), files: state.startEigenCoaFiles }
      );
      delete state.runningCaseIds['__new__'];
      state.cases.unshift(created);
      goDetail(created.id);
    } catch(e){
      delete state.runningCaseIds['__new__'];
      // BESLUIT RUBEN 23 september 2026 (taak raccoonpeptides.com): "dat we
      // zeggen dat je deze niet kan checken en dat we de URL die doorgelinkt
      // is invuld in het veld die je wel kan checken". Het veld wordt dus
      // ingevuld, maar er start NIETS vanzelf - de volgende druk op start is
      // van de gebruiker, niet van ons.
      if (e.code === 'doorgelinkt' && e.doorgelinktNaar){
        state.startDraft.website = e.doorgelinktNaar;
        state.startUrlError = e.message || 'Deze website stuurt je door naar een andere winkel.';
        renderDashboard();
        var veld = app.querySelector('#f-website');
        if (veld) veld.focus();
      } else if (e.code === 'invalid_coa_url'){
        state.startEigenCoaError = e.message || 'Die link kunnen we niet lezen.';
        renderDashboard();
      } else if (e.code === 'invalid_url' || e.code === 'not_peptide_supplier'){
        state.startUrlError = e.message || 'Vul een geldige web URL in.';
        renderDashboard();
      } else {
        renderDashboard();
        alert('Aanmaken van de case is mislukt: ' + (e && e.message ? e.message : 'onbekende fout'));
      }
    }
  }

  // ---------- case detail ----------
  function renderDetail(){
    var c = state.currentCase;
    if (!c){ app.innerHTML = '<p>Case laden…</p>'; stopCasePoller(); return; }

    if (c.status === 'bezig'){
      // Live-weergave (Figma "URL check", 14 sep): eigen kaart i.p.v. de
      // detail-head/chip + retry-bare renderProgress()-lijst + losse terug-
      // en stop-knoppen hieronder; die blijven ongewijzigd voor fout/
      // gestopt/klaar.
      app.innerHTML = '<button type="button" class="stop-link" id="stop-audit"><span class="chev">' + ICON_CHEVRON_LEFT + '</span><span class="lbl">' + (c.tier === 'deep' ? 'Stop de Deepdive' : 'Stop de check') + '</span></button>' +
        renderRunningCard(c);
      wireDetailStopButton(c);
      return;
    }

    var chip = '<span class="chip grey">Nieuw</span>';
    if (c.status === 'fout') chip = '<span class="chip danger">Fout</span>';
    else if (c.status === 'gestopt') chip = '<span class="chip grey">Gestopt</span>';
    else if (c.status === 'gratis_klaar') chip = '<span class="chip ok">Gratis check klaar</span>';
    else if (c.status === 'klaar') chip = '<span class="chip ok">' + (c.tier === 'deep' ? 'Deep Dive klaar' : 'Klaar') + '</span>';

    var toontRapport = (c.status === 'klaar' || c.status === 'gratis_klaar') && !!c.report;
    // Bij een rapport geen terugknop en geen statuschip: het logo in de header
    // brengt je terug en de status staat al in het rapport zelf.
    var html = toontRapport ? '' : '<button class="btn ghost" id="back-to-dash">&larr; Terug naar overzicht</button>';
    html += toontRapport
      ? ''
      : '<div class="detail-head"><div><h2>' + escapeHtml(c.naam) + '</h2>' +
        '<div class="site"><a href="' + escapeHtml(c.website) + '" target="_blank" rel="noopener">' + escapeHtml(c.website) + '</a></div>' +
        '<div class="kv-row"><span>KvK-uittreksel: <span class="mono">' + (c.kvkNummer ? escapeHtml(c.kvkNummer) : 'nog niet gekoppeld') + '</span></span>' +
        '<span>Aangemaakt: ' + fmtDate(c.createdAt) + '</span></div></div>' +
        '<div>' + chip + '</div></div>';

    if (c.status === 'fout'){
      html += '<div class="banner danger">Audit mislukt: ' + escapeHtml(c.error || 'onbekende fout') + '</div>' +
        '<button class="btn" id="retry-audit">Opnieuw proberen</button>';
      if (c.progress && c.progress.length) html += renderProgress(c);
    }
    if (c.status === 'gestopt'){
      html += '<div class="banner">Deze audit is handmatig gestopt' + (c.currentStep ? ' tijdens de stap "' + escapeHtml(stepLabel(c.currentStep.key)) + '"' : '') + '.</div>' +
        '<button class="btn" id="retry-audit">Opnieuw proberen</button>';
      if (c.progress && c.progress.length) html += renderProgress(c);
    }
    if (toontRapport){
      html += renderReport(c);
      html += '<section class="report-block"><h3>Afgeronde stappen</h3>' + renderProgress(c) + '</section>';
      html += '<div style="margin-top:24px;"><button class="btn secondary" id="retry-audit">Opnieuw analyseren</button></div>';
    }

    app.innerHTML = html;
    var backBtn = app.querySelector('#back-to-dash');
    if (backBtn) backBtn.addEventListener('click', goDashboard);
    var retryBtn = app.querySelector('#retry-audit');
    if (retryBtn) retryBtn.addEventListener('click', function(){ rerunCase(c); });
    // Uitklappers, "Lees meer" en elke knop die het Deep Dive-paneel opent.
    Array.prototype.forEach.call(app.querySelectorAll('.acc-header'), function(btn){
      btn.addEventListener('click', function(){
        var item = btn.parentNode;
        var open = item.getAttribute('data-open') !== 'true';
        // Er staat er altijd maar een open, ook over de groepen heen.
        Array.prototype.forEach.call(app.querySelectorAll('.acc-item'), function(ander){
          if (ander === item) return;
          ander.setAttribute('data-open', 'false');
          var kop = ander.querySelector('.acc-header');
          if (kop) kop.setAttribute('aria-expanded', 'false');
        });
        item.setAttribute('data-open', open ? 'true' : 'false');
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        // Pas nu is de tekst zichtbaar en dus meetbaar.
        if (open) klemCheck(item);
      });
    });
    Array.prototype.forEach.call(app.querySelectorAll('.lees-meer'), function(btn){
      btn.addEventListener('click', function(){
        var blok = btn.parentNode;
        var open = blok.classList.toggle('open');
        btn.textContent = open ? 'Lees minder' : 'Lees meer';
      });
    });
    // Geen schermafdruk op de server? Dan de lege plek laten zien in plaats
    // van een kapot plaatje.
    Array.prototype.forEach.call(app.querySelectorAll('.site-shot-foto'), function(img){
      img.addEventListener('error', function(){
        img.hidden = true;
        var leeg = img.parentNode.querySelector('.site-shot-leeg');
        if (leeg) leeg.hidden = false;
      });
    });
    klemCheck(app);
    startBalken(app);
    Array.prototype.forEach.call(app.querySelectorAll('.js-deepdive-info'), function(btn){
      btn.addEventListener('click', function(){ openSheet('Wat is een Deepdive', deepdiveInfoBody()); });
    });
    // Vestiging: de regel is de knop, de uitleg is een overlay.
    Array.prototype.forEach.call(app.querySelectorAll('.js-vest-regel'), function(knop){
      knop.addEventListener('click', function(e){
        e.stopPropagation();
        wisselVestiging(knop.closest('.vestiging'));
      });
    });
    // Ernaast klikken of Escape sluit hem ook. Een keer registreren, niet bij
    // elke render opnieuw - anders stapelen de luisteraars zich op.
    if (!window.__vestSluiters){
      window.__vestSluiters = true;
      document.addEventListener('click', function(e){
        Array.prototype.forEach.call(document.querySelectorAll('.vestiging.open'), function(sec){
          if (!sec.contains(e.target)) sluitVestiging(sec);
        });
      });
      document.addEventListener('keydown', function(e){
        if (e.key !== 'Escape') return;
        Array.prototype.forEach.call(document.querySelectorAll('.vestiging.open'), function(sec){
          sluitVestiging(sec);
        });
      });
    }
    // De Deep Dive is vanaf twee plekken te starten: de kaart en de knop
    // onder de stappenlijst. Beide lopen via dezelfde klasse.
    Array.prototype.forEach.call(app.querySelectorAll('.js-continue-deep'), function(btn){
      var oorspronkelijk = btn.textContent;
      btn.addEventListener('click', function(){
        btn.disabled = true; btn.textContent = 'Starten…';
        apiContinueDeep(c.id).then(function(updated){
          if (state.currentCaseId !== c.id) return;
          state.currentCase = updated;
          render();
          if (updated.status === 'bezig') ensureCasePoller(c.id);
        }).catch(function(e){
          btn.disabled = false; btn.textContent = oorspronkelijk;
          alert('Starten van de Deep Dive is mislukt: ' + (e && e.message ? e.message : 'onbekende fout'));
        });
      });
    });
    // (De 'bezig'-status heeft een eigen #stop-audit-link + wiring hierboven
    // via wireDetailStopButton() en return()t vóór dit punt.)
    var stuckBtn = app.querySelector('#retry-stuck');
    if (stuckBtn) stuckBtn.addEventListener('click', function(){ runSingleStep(c.id, stuckBtn.getAttribute('data-key')); });
    Array.prototype.forEach.call(app.querySelectorAll('.step-retry'), function(btn){
      btn.addEventListener('click', function(){ runSingleStep(c.id, btn.getAttribute('data-key')); });
    });
  }

  // Live-lopende kaart voor status 'bezig' (Figma "URL check" en "Deepdive",
  // 15 sep) — toont de stappen die voor deze run relevant zijn
  // (runRijenVoorCase), zonder retry-knoppen; renderProgress() hieronder
  // blijft de bron voor fout/gestopt/klaar, waar retry wel zinvol is.
  // Live-logje binnen de lopende stap. Zonder dit staat er minutenlang alleen
  // "bezig" en is niet te zien of er nog iets gebeurt. De tijdstempels zijn
  // het eigenlijke signaal: lopen die op, dan leeft hij nog.
  function renderStapLog(c){
    var st = c && c.currentStep;
    var log = (st && Array.isArray(st.log)) ? st.log : [];
    if (!st) return '';
    if (!log.length){
      return '<div class="stap-log leeg">Nog geen tussenstand van deze stap.</div>';
    }
    var regels = log.slice().reverse().map(function(r, i){
      var sinds = fmtDuration(Date.now() - r.t);
      return '<div class="stap-log-regel' + (i === 0 ? ' nieuwste' : '') + '">' +
        '<span class="stap-log-tijd">' + escapeHtml(sinds) + ' geleden</span>' +
        '<span class="stap-log-tekst">' + escapeHtml(r.tekst) + '</span></div>';
    }).join('');
    return '<details class="stap-log"><summary>' +
      escapeHtml(st.detail || log[log.length - 1].tekst) +
      '</summary><div class="stap-log-body">' + regels + '</div></details>';
  }

  function renderRunningCard(c){
    var progress = c.progress || [];
    var doneMap = {};
    progress.forEach(function(p){ doneMap[p.key] = p; });
    var rijen = runRijenVoorCase(c);
    // Tijdens een Deep Dive staat de gratis run als afgerond blok bovenaan en
    // komen de deep-stappen daaronder. categorize en de twee rapportstappen
    // draaien een tweede keer over de volledige dataset, dus die staan in
    // beide blokken. Omdat progress per sleutel maar een regel bewaart, kan
    // de tweede reeks niet uit doneMap worden afgeleid: die volgt uit de
    // positie ten opzichte van de stap die nu draait.
    var deepStart = rijen.length;
    for (var di = 0; di < rijen.length; di++){ if (rijen[di].fase === 'deep'){ deepStart = di; break; } }
    // Tussen "Deep Dive gestart" en de eerste deep-stap wijst currentStep nog
    // naar de laatste stap van de gratis run. Zonder deze check zou die dan
    // matchen op dezelfde sleutel in het deep-blok en het hele blok ten
    // onrechte als afgerond tonen.
    var deepBezig = false;
    if (c.tier === 'deep' && c.currentStep){
      deepBezig = DEEP_STEP_KEYS.indexOf(c.currentStep.key) !== -1 ||
        (!!doneMap.reportB && c.currentStep.startedAt > doneMap.reportB.ts);
    }
    var actief = -1;
    if (c.currentStep && (c.tier !== 'deep' || deepBezig)){
      var zoekVanaf = (c.tier === 'deep') ? deepStart : 0;
      for (var aj = zoekVanaf; aj < rijen.length; aj++){
        if (rijen[aj].key === c.currentStep.key){ actief = aj; break; }
      }
    }

    var stepsHtml = rijen.map(function(rij, idx){
      var entry = doneMap[rij.key];
      var isCurrent, done;
      if (rij.fase === 'deep'){
        isCurrent = (idx === actief);
        // Geen actieve deep-stap betekent hier: de Deep Dive is nog niet
        // begonnen. De regels uit de gratis run tellen dan niet mee.
        done = (actief === -1) ? false : (idx < actief);
      } else if (c.tier === 'deep'){
        // De gratis run is per definitie af zodra de Deep Dive loopt.
        isCurrent = false; done = !!entry;
      } else {
        isCurrent = !!(c.currentStep && c.currentStep.key === rij.key);
        done = !!entry && !isCurrent;
      }
      var sep = (idx === deepStart && deepStart > 0) ? '<div class="run-step-sep"></div>' : '';
      if (done){
        return sep + '<div class="run-step done"><span class="step-icon">' + ICON_STEP_DONE + '</span>' +
          '<span class="run-step-label">' + escapeHtml(rij.label) + '</span>' +
          '<span class="run-step-dur">' + (entry ? fmtDuration(entry.durationMs) : '') + '</span></div>';
      }
      if (isCurrent){
        return sep + '<div class="run-step active"><span class="step-icon active"></span>' +
          '<span class="run-step-label">' + escapeHtml(rij.label) + '</span>' +
          '<span class="run-step-meta">bezig ' + fmtDuration(Date.now() - c.currentStep.startedAt) +
          ' <span class="avg">&middot; gemiddeld ' + fmtDuration(avgForStep(rij.key)) + '</span></span></div>' +
          renderStapLog(c);
      }
      return sep + '<div class="run-step pending"><span class="step-icon pending"></span>' +
        '<span class="run-step-label">' + escapeHtml(rij.label) + '</span></div>';
    }).join('');

    var stuckBanner = '';
    if (isStuck(c)){
      stuckBanner = '<div class="banner" style="margin-top:16px;">Deze stap ("' + escapeHtml(stepLabel(c.currentStep.key)) + '") duurt langer dan gemiddeld (' +
        fmtDuration(Date.now() - c.currentStep.startedAt) + ' tegen normaal ' + fmtDuration(avgForStep(c.currentStep.key)) + ').</div>';
    }

    return '<div class="run-card"><div class="run-slot">' +
      '<div><div class="run-url">' + escapeHtml(c.website) + '</div>' +
      '<div class="run-meta"><span class="kvk">KvK-uittreksel: ' + (c.kvkNummer ? escapeHtml(c.kvkNummer) : 'nog niet gekoppeld') + '</span>' +
      '<span class="created">Aangemaakt: ' + fmtDate(c.createdAt) + '</span></div>' +
      (c.naam && c.naam !== c.website ? '<div class="run-name">' + escapeHtml(c.naam) + '</div>' : '') +
      '</div>' +
      '<div class="run-steps">' + stepsHtml + '</div>' +
      '</div></div>' + stuckBanner;
  }

  // Wiring voor de "Stop de check"-link boven de live-kaart — vervangt de
  // oude losse "Stop audit"-knop; label/chevron blijven staan tijdens het
  // stoppen, alleen de tekst in .lbl wisselt.
  function wireDetailStopButton(c){
    var stopBtn = app.querySelector('#stop-audit');
    if (!stopBtn) return;
    stopBtn.addEventListener('click', function(){
      var lbl = stopBtn.querySelector('.lbl');

  // ---------- Deep Dive-informatiepaneel ----------

  // bottomsheet op mobiel. Dat verschil zit volledig in CSS, dus hier is geen

  var DEEPDIVE_PUNTEN = [

  var sheetVorigeFocus = null;
  function sheetEscape(e){ if (e.key === 'Escape' || e.keyCode === 27) closeSheet(); }
  function openSheet(titel, bodyHtml){
    var root = document.getElementById('sheet-root');
    if (!root) return;

    root.innerHTML = '<div class="sheet-overlay" id="sheet-overlay">' +
      '<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="' + escapeHtml(titel) + '">' +

      '</div>' +
      '<div class="sheet-body">' + bodyHtml + '</div>' +
      '</div></div>';
    document.body.classList.add('sheet-open');
    var overlay = document.getElementById('sheet-overlay');
    // Klik naast het paneel sluit het; een klik in het paneel zelf niet.
    overlay.addEventListener('click', function(e){ if (e.target === overlay) closeSheet(); });
    var sluit = document.getElementById('sheet-close');

  function closeSheet(){
    var root = document.getElementById('sheet-root');
    if (root) root.innerHTML = '';
    document.body.classList.remove('sheet-open');
    document.removeEventListener('keydown', sheetEscape);
    if (sheetVorigeFocus && sheetVorigeFocus.focus) sheetVorigeFocus.focus();
    sheetVorigeFocus = null;

  function renderProgress(c){
    var progress = c.progress || [];
    var doneMap = {};
    progress.forEach(function(p){ doneMap[p.key] = p; });
    var allowRetry = c.status !== 'bezig';
    var running = !!state.runningCaseIds[c.id];
    // Bij een retry van één losse stap (runSingleStep) loopt er maar één
    // stap opnieuw op de backend — runningStepKeys onthoudt precies welke,
    // zodat hier niet alle stappen "bezig…" tonen terwijl er maar één draait.
    var runningStepKey = state.runningStepKeys[c.id];

    function regel(s){
      var done = doneMap[s.key];
      var isCurrent = c.status === 'bezig' && c.currentStep && c.currentStep.key === s.key;
      var isRetryingThis = running && s.key === runningStepKey;
      // Wat de backend na een retry sowieso opnieuw doet (zie retry-step in
      // server.js): de stap zelf, daarna categorisatie, scoring en de twee
      // rapportstappen. Die stonden groen terwijl ze overschreven werden.
      // Geel betekent hier: staat er nog, maar wordt zo vervangen.
      var isStale = false;
      if (running && runningStepKey && !isRetryingThis && done){
        if (runningStepKey === 'reportA' || runningStepKey === 'reportB'){
          isStale = (s.key === 'reportA' || s.key === 'reportB');
        } else {
          isStale = ['categorize', 'reportA', 'reportB'].indexOf(s.key) !== -1;
        }
      }
      var cls = isRetryingThis ? 'active busy'
        : (isStale ? 'stale' : (done ? 'done' : (isCurrent ? 'active' : '')));
      var hint = '';
      if (isRetryingThis){
        hint = '<span class="step-hint">bezig…</span>';
      } else if (isStale){
        hint = '<span class="step-hint">wordt opnieuw gedaan</span>';
      } else if (done){
        hint = '<span class="step-hint">' + fmtDuration(done.durationMs) + '</span>';
      } else if (isCurrent){
        hint = '<span class="step-hint">bezig ' + fmtDuration(Date.now() - c.currentStep.startedAt) +
          ' &middot; gemiddeld ' + fmtDuration(avgForStep(s.key)) + '</span>';
      } else if (stepStats && stepStats[s.key]){
        hint = '<span class="step-hint">gemiddeld ' + fmtDuration(stepStats[s.key].avgMs) + '</span>';
      }
      var retryBtn = (done && allowRetry && !running) ? '<button type="button" class="step-retry btn ghost" data-key="' + s.key + '">opnieuw</button>' : '';
      // Een draaiende stap krijgt een loader in plaats van een stip; anders is
      // aan niets te zien dat hij bezig is.
      var marker = isRetryingThis
        ? '<span class="spinner" aria-hidden="true"></span>'
        : '<span class="dot"></span>';
      var rij = '<div class="progress-item ' + cls + '">' + marker + '<span class="step-label">' + escapeHtml(s.label) + '</span>' + hint + retryBtn + '</div>';
      return isCurrent ? (rij + renderStapLog(c)) : rij;
    }

    // Eerst wat gedraaid is, in de volgorde waarin het draaide. Daarna pas
    // wat de Deep Dive nog zou toevoegen; dat door elkaar zetten leest als
    // een lijst met gaten erin.
    var gedaan = STEP_DEFS.filter(function(s){
      return doneMap[s.key] || (c.currentStep && c.currentStep.key === s.key) || s.key === runningStepKey;
    });
    var nogTeDoen = c.tier === 'deep' ? [] : STEP_DEFS.filter(function(s){
      return DEEP_STEP_KEYS.indexOf(s.key) !== -1 && !doneMap[s.key];
    });

    var uit = '';
    if (gedaan.length){
      uit += '<div class="card"><div class="progress-list">' + gedaan.map(regel).join('') + '</div></div>';
    }
    if (nogTeDoen.length){
      uit += '<h4 class="progress-kop">Deepdive check</h4>' +
        '<div class="card"><div class="progress-list">' +
        nogTeDoen.map(function(s){
          return '<div class="progress-item"><span class="dot"></span><span class="step-label">' + escapeHtml(s.label) + '</span></div>';
        }).join('') + '</div></div>' +
        '<div class="progress-actie"><button type="button" class="btn-cta js-continue-deep">Start de deepdive check</button></div>';
    }

    var stuckBanner = '';
    if (isStuck(c)){
      stuckBanner = '<div class="banner">Deze stap ("' + escapeHtml(stepLabel(c.currentStep.key)) + '") duurt langer dan gemiddeld (' +
        fmtDuration(Date.now() - c.currentStep.startedAt) + ' tegen normaal ' + fmtDuration(avgForStep(c.currentStep.key)) + ').<br>' +
        '<button type="button" class="btn ghost" id="retry-stuck" data-key="' + c.currentStep.key + '" style="margin-top:8px;border:1px solid var(--border);border-radius:6px;">Opnieuw proberen vanaf deze stap</button></div>';
    }

    return uit + stuckBanner;
  }

  // Exacte UI-state copy uit "Ruben - Webapp Audit Flow v1.0.md" §Concrete

  var UI_STATES = {

    unreadableCoa: { title:'COA-analyse kan nog niet worden uitgevoerd', text:'We vonden COA-verwijzingen, maar konden de bestanden niet openen of voldoende uitlezen. Upload de originele bestanden om deze analyses voort te zetten.' },
    independenceInsufficient: { title:'⚪ Niet onafhankelijk verifieerbaar', text:'De analytische claims steunen uitsluitend op onvoldoende onafhankelijk verifieerbare labs. Daarom tonen we geen onafhankelijk bevestigde Identity-, Purity- of Quantity-uitkomst voor de getroffen analyses.' },
    sourceClaimDetail: { title:'Niet onafhankelijk bevestigd', text:'Het lab rapporteert de waarde hieronder. Dit is een gerapporteerde bronwaarde en telt niet als zelfstandig geverifieerd productbewijs.' },
    noDeepNeeded: { title:'Geen betaalde verdieping noodzakelijk op dit moment', text:'De huidige open vragen geven geen concrete aanleiding voor bedrijfsverdieping.' }

  function renderGateBanner(engine){
    if (!engine || !engine.gate) return '';
    var gate = engine.gate;
    if (gate.code === 'NO_COA_FOUND'){
      return '<div class="banner"><strong>' + escapeHtml(UI_STATES.missingCoa.title) + '</strong><br>' + escapeHtml(UI_STATES.missingCoa.text) + '</div>';
    }
    if (gate.code === 'COA_ACCESS_OR_PARSE_BLOCKED'){
      return '<div class="banner"><strong>' + escapeHtml(UI_STATES.unreadableCoa.title) + '</strong><br>' + escapeHtml(UI_STATES.unreadableCoa.text) + '</div>';
    }
    // De rapporten zijn wel gelezen; ze tellen niet mee omdat het lab
    // eronder niet te verifieren is. Dat stond eerder onder de vorige tak, en
    // die raadt aan de bestanden te uploaden - wat hier niets oplost, want
    // hetzelfde lab staat er dan nog steeds onder. De tekst hieronder stond al
    // in UI_STATES maar werd nergens gebruikt.
    // A16: de rapporten zijn gelezen, maar nog niet is vastgesteld dat ze over
    // dit product gaan. Geen afkeuring en geen leesprobleem - uploaden helpt
    // hier dus net zo min als bij LAB_NOT_VERIFIABLE.
    if (gate.code === 'KOPPELING_NIET_VASTGESTELD'){
      var wacht = gate.wachtOpBeoordeling || 0;
      return '<div class="banner"><strong>De rapporten zijn gelezen, de koppeling naar dit product nog niet vastgesteld</strong><br>' +
        'Bij ' + (gate.doorKoppelingCount || 1) + ' van de ' + gate.foundCount + ' gevonden rapporten toetste het laboratorium de ' +
        'identiteit tegen een andere stof dan de productnaam op het etiket. Dat kan een handelsnaam zijn, ' +
        'maar zolang dat niet is nagekeken tellen die rapporten niet mee als bewijs voor dit product.' +
        (wacht ? '<br>' + wacht + ' geval(len) wachten op een handmatige beoordeling.' : '') +
        (gate.koppelingReden ? '<br>' + escapeHtml(gate.koppelingReden) : '') +
        '<br>Uploaden van de bestanden verandert dit niet: de rapporten zijn leesbaar, het verband met het product is nog niet aangetoond.</div>';
    }
    if (gate.code === 'LAB_NOT_VERIFIABLE'){
      var aantal = gate.doorLabCount || gate.gelezenCount || gate.foundCount;
      var telling = aantal
        ? ('Van de ' + gate.foundCount + ' gevonden rapporten zijn er ' + (gate.gelezenCount || aantal) +
           ' gelezen; geen daarvan telt als onafhankelijk bewijs.')
        : '';
      return '<div class="banner"><strong>' + escapeHtml(UI_STATES.independenceInsufficient.title) + '</strong><br>' +
        escapeHtml(UI_STATES.independenceInsufficient.text) +
        (telling ? '<br>' + escapeHtml(telling) : '') +
        (gate.labReden ? '<br>' + escapeHtml(gate.labReden) : '') +
        '<br>Uploaden van de bestanden verandert dit niet: de rapporten zijn leesbaar, het laboratorium erachter is niet te bevestigen.</div>';
    }
    var chip = gate.status === 'PASS' ? 'ok' : 'warn';
    var note = gate.status === 'PASS'
      ? 'Identity, Purity en Quantity zijn elk door minstens één bruikbare COA gedekt.'
      : 'Sommige kernvelden (Identity, Purity, Quantity) zijn nog niet allemaal door een bruikbare COA gedekt; wat wel bruikbaar is, wordt hieronder beoordeeld.';
    // Geen eigen paneel meer: dit is een voetnoot bij het rapport, geen
    // waarschuwing. De twee harde gate-uitkomsten hierboven blijven wel een
    // banner, want die zeggen dat er iets niet beoordeeld kon worden.
    return '<p class="rapport-gate">Evidence Gate: ' + escapeHtml(gate.status) + '. ' +
      escapeHtml(note) + ' (' + gate.foundCount + ' COA gevonden, ' + gate.usableCount + ' bruikbaar.)</p>';
  }

  // ---------- Rapport (Figma "Rapport" 494:14614, bijgewerkt 16 sep) ----------

  // De drie blokken in het Stats URL-block: Openheid, Externe verificatie,
  // Productbewijs. A1 is hiermee ingevuld. Hier stonden drie balken met vaste
  // percentages uit de Figma-opzet die aan niets hingen; die zijn weg.
  //
  // De getallen worden NIET hier bedacht. src/blokken.js telt ze op uit wat
  // al is vastgesteld, en dit rendert alleen. Een stip is een rapport of een

  // Hoeveel regels blijven staan voordat er wordt ingeklapt. Alleen in de
  // tekstblokken van het tweede deel; de COA-blokken staan er helemaal uit.
  var KLEM_TEKST = 3;

  function accItem(titel, bodyHtml, opties){
    if (!bodyHtml) return '';
    var o = opties || {};
    var open = o.open ? 'true' : 'false';
    var sub = o.sub ? '<span class="acc-sub">' + escapeHtml(o.sub) + '</span>' : '';
    var telling = o.telling ? '<span class="acc-telling">' + escapeHtml(o.telling) + '</span>' : '';
    return '<div class="acc-item" data-open="' + open + '">' +
      '<button type="button" class="acc-header" aria-expanded="' + open + '">' +

      telling + '<span class="acc-chevron">' + ICON_CARET + '</span></button>' +
      '<div class="acc-body' + (o.columns ? ' acc-columns' : '') + '">' + bodyHtml + '</div></div>';

  function alineasHtml(tekst){
    return String(tekst || '').split(/\n\s*\n/)
      .filter(function(t){ return t.trim(); })
      .map(function(t){ return '<p>' + escapeHtml(t.trim()) + '</p>'; }).join('');
  }

  // Inklappen op regels in plaats van op tekens: -webkit-line-clamp knipt op
  // de regel zoals die op dit scherm valt, dus het klopt op elke breedte. De
  // knop staat er alleen als er echt iets wegvalt; dat bepaalt klemCheck().
  function klemBlok(inhoudHtml, regels){
    if (!inhoudHtml) return '';
    return '<div class="klem" style="--regels:' + (regels || KLEM_TEKST) + '">' +
      '<div class="klem-tekst">' + inhoudHtml + '</div>' +
      '<button type="button" class="lees-meer" hidden>Lees meer</button></div>';
  }

  function klemCheck(root){
    var blokken = (root || document).querySelectorAll('.klem');
    Array.prototype.forEach.call(blokken, function(blok){
      var tekst = blok.querySelector('.klem-tekst');
      var knop = blok.querySelector('.lees-meer');
      if (!tekst || !knop || blok.classList.contains('open')) return;
      // Nog ingeklapte uitklapper: hoogte is 0, dus meten heeft geen zin.
      if (!tekst.clientHeight) return;
      knop.hidden = tekst.scrollHeight <= tekst.clientHeight + 2;
    });
  }

  function bevindingenLijst(items, cls){
    if (!items || !items.length) return '';
    return '<ul class="findings">' + items.map(function(i){
      return '<li' + (cls ? ' class="' + cls + '"' : '') + '>' + escapeHtml(i) + '</li>';
    }).join('') + '</ul>';
  }

  function pijlerBody(engine, pillar){

  function evidenceScoreBody(engine){

  function supplierScoreBody(engine, tier){
    if (tier !== 'deep' || !engine || !engine.deep || engine.deep.value == null) return '';
