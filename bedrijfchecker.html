  function quantityBody(coaRecords, engine){
    var withQty = (coaRecords || []).filter(function(r){ return r.quantity && r.quantity.deviationPct != null; });
    if (!withQty.length) return '';
    var onafhankelijk = engine && engine.assessments && engine.assessments.C04 && !engine.assessments.C04.dependencyApplied;
    var rows = withQty.map(function(r){
      var q = r.quantity;
      var signaal = q.signalGt20 ? '<span class="chip danger">&gt;20%</span>'
        : q.signalGt10 ? '<span class="chip warn">&gt;10%</span>'
        : '<span class="chip ok">binnen 10%</span>';
      return '<tr><td>' + escapeHtml(r.product || 'onbekend') + '</td><td>' + escapeHtml(r.batchnummer || '-') + '</td>' +
        '<td>' + (r.claimedQuantity != null ? r.claimedQuantity + ' ' + escapeHtml(r.claimedUnit || '') : '-') + '</td>' +
        '<td>' + (r.measuredQuantity != null ? r.measuredQuantity + ' ' + escapeHtml(r.measuredUnit || '') : '-') + '</td>' +
        '<td>' + (q.deviationPct != null ? (Math.round(q.deviationPct * 100) / 100) + '%' : '-') + '</td>' +
        '<td>' + signaal + '</td></tr>';
    }).join('');
    var note = onafhankelijk ? '' :
      '<p class="acc-note">' + escapeHtml(UI_STATES.sourceClaimDetail.title) + ': ' + escapeHtml(UI_STATES.sourceClaimDetail.text) + '</p>';
    return '<div style="overflow-x:auto;"><table class="mono" style="width:100%;border-collapse:collapse;font-size:.85rem;">' +
      '<thead><tr><th style="text-align:left;padding:4px 8px;">Product</th><th style="text-align:left;padding:4px 8px;">Batch</th>' +
      '<th style="text-align:left;padding:4px 8px;">Claim</th><th style="text-align:left;padding:4px 8px;">Gemeten</th>' +
      '<th style="text-align:left;padding:4px 8px;">Afwijking</th><th style="text-align:left;padding:4px 8px;">Signaal</th></tr></thead>' +
      '<tbody>' + rows + '</tbody></table></div>' + note;
  }

  // De bedrijfsnaam is soms gewoon het domein; dan staat het er twee keer.
  function bedrijfsnaam(c){
    var naam = String(c.naam || '').trim();
    if (!naam) return '';
    var domein = domainOf(c.website);
    var kaal = naam.toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/$/, '');
    if (kaal === domein.toLowerCase() || kaal === String(c.website || '').toLowerCase()) return '';
    return naam;
  }

  // Korte uitleg boven de balken. Er is geen apart veld voor in het rapport,
  // dus dit is de eerste alinea van de executive summary.
  function korteUitleg(c){
    var samenvatting = String((c.report || {}).executiveSummary || '').trim();
    var eerste = samenvatting.split(/\n\s*\n/)[0] || samenvatting;
    return eerste ? '<p class="stats-intro">' + escapeHtml(eerste) + '</p>' : '';
  }

  function blokkenVan(c){
    return (c.engineResult && c.engineResult.blokken) || c.blokken || null;
  }

  // De balk uit Anne's designsysteem: een track met een vulling die na het
  // renderen uitslaat (.is-on, zie startBalken). Hij vervangt de stippen:
  // Ruben wil dezelfde balk als in het ontwerp, met dezelfde animatie.
  //
  // De balk is een AANDEEL, geen cijfer over de leverancier. Bij Openheid is
  // dat aanwezig/noemer, bij Externe verificatie geverifieerd/gevonden. Staat
  // er geen aandeel te berekenen, dan staat er ook geen balk.
  function balkHtml(pct, telop){
    if (pct == null) return '';
    var p = Math.max(0, Math.min(100, Math.round(pct)));
    return '<div class="stat-bar" data-pct="' + p + '" style="--pct:' + p + '"' + (telop || '') + '>' +
      '<div class="stat-bar-track"><span class="stat-bar-fill"></span></div></div>';
  }

  function blokHtml(o){
    return '<div class="blok ' + o.kleur + '">' +
      '<span class="blok-label">' + escapeHtml(o.label) +
        (o.sub ? '<span class="blok-sub">' + escapeHtml(o.sub) + '</span>' : '') +
        (o.stap ? '<span class="blok-stap">' + o.stap + '</span>' : '') + '</span>' +
      '<span class="blok-waarde' + (o.woord ? ' woord' : '') + '">' + o.waarde + '</span>' +
      (o.balk || '') +
      (o.uitleg ? '<span class="blok-uitleg">' + escapeHtml(o.uitleg) + '</span>' : '') +
      ((o.lijnen || []).length
        ? '<span class="blok-lijnen">' + o.lijnen.map(function(l){
            return '<span class="blok-lijn">' + escapeHtml(l) + '</span>';
          }).join('') + '</span>'
        : '') +
      (o.werk ? '<span class="blok-werk mono">' + escapeHtml(o.werk) + '</span>' : '') +
      '</div>';
  }

  // Vier tegels, twee boven en twee onder (besluit Ruben, 23 september).
  //
  //   1 Openheid        2 Productbewijs
  //   3 Zuiverheid      4 Onder of boven vulling
  //
  // Externe verificatie en productbewijs waren twee tegels die allebei
  // "zoveel van de zoveel rapporten" telden. Dat las als twee noemers voor
  // dezelfde stapel; ze zijn nu een.
  //
  // LET OP - GEEN OORDEEL IN TEGEL 3 EN 4. Het zijn gemiddelden van wat in de
  // rapporten staat. De kleurregel voor deze getallen is A24 en ligt bij
  // Annemarie; B-1 (vanaf welke overvulling is het een bevinding) en B-2 (mag
  // een smalle spreiding zelf een bevinding zijn) staan ook nog open.
  //
  // De getallen en hun schrijfwijze komen uit src/blokken.js.
  function blokkenHtml(c){
    var b = blokkenVan(c);
    if (!b) return '';
    var op = b.openheid || {}, ve = b.verificatie || {}, pb = b.productbewijs || {};
    var l = b.lab || {};

    // Schalen. Een zuiverheidsbalk van 0 tot 100 staat altijd vol en laat geen
    // verschil zien; die loopt daarom van 90 tot 100. De vulling loopt van 90
    // tot 110, met het etiket (100%) in het midden, zodat te weinig en te veel
    // op dezelfde schaal staan.
    var Z_MIN = 90, Z_MAX = 100, V_SPEELRUIMTE = 10;
    function schaal(waarde, min, max){
      if (waarde == null) return null;
      return Math.max(0, Math.min(100, ((waarde - min) / (max - min)) * 100));
    }
    // De vullingbalk meet iets anders dan de zuiverheidsbalk: niet hoeveel,
    // maar hoe dicht bij het etiket. Vol bij 100%, leeg bij 90% en bij 110%.
    // Te weinig en te veel tellen dus even zwaar - welke van de twee het is,
    // staat in de regels eronder (besluit Ruben, 23 september).
    function naderEtiket(waarde){
      if (waarde == null) return null;
      return Math.max(0, Math.min(100, (1 - Math.abs(waarde - 100) / V_SPEELRUIMTE) * 100));
    }

    // 1 - Openheid. Het getal telt mee omhoog terwijl de balk uitslaat.
    var openPct = op.noemer ? (100 * (op.aanwezig || 0)) / op.noemer : null;
    var openheid = blokHtml({
      label:'Openheid', stap:'1', kleur: op.kleur || 'grey',
      waarde: '<span class="js-telop">' + (op.aanwezig != null ? op.aanwezig : '—') + '</span>' +
        '<span class="klein"> van ' + (op.noemer || 0) + '</span>',
      balk: balkHtml(openPct, ' data-telop="' + (op.aanwezig || 0) + '"'),
      uitleg: op.toelichting || null,
      werk: op.werkregel || null
    });

    // 2 - Productbewijs. Het grote getal is de hardste uitspraak die we
    // hebben: hoeveel van de gevonden rapporten onafhankelijk bevestigd zijn.
    var bewijsWerk = [ve.werkregel, pb.werkregel].filter(Boolean).join(' · ');
    var bewijsKleur = (ve.kleur === 'red' || pb.kleur === 'red') ? 'red' : (ve.kleur || pb.kleur || 'grey');
    var bewijsWaarde, bewijsWoord = false, bewijsBalk = '';
    if (ve.totaal){
      var bevestigd = (ve.telling && ve.telling.geverifieerd) || 0;
      bewijsWaarde = '<span class="js-telop">' + bevestigd + '</span>' +
        '<span class="klein"> van ' + ve.totaal + '</span>';
      bewijsBalk = balkHtml((100 * bevestigd) / ve.totaal, ' data-telop="' + bevestigd + '"');
    } else {
      bewijsWaarde = escapeHtml(String(ve.woord || pb.waarde || '—'));
      bewijsWoord = true;
    }
    var bewijs = blokHtml({
      label:'Productbewijs', stap:'2', kleur: bewijsKleur,
      waarde: bewijsWaarde, woord: bewijsWoord, balk: bewijsBalk,
      uitleg: ve.totaal && ve.woord ? ve.woord : null,
      werk: bewijsWerk || null
    });

    // 3 - Zuiverheid, gemiddeld.
    var zuiver = '';
    var z = l.zuiverheid;
    if (z && z.weergave){
      zuiver = blokHtml({
        label:'Zuiverheid', sub:'Gemiddeld', stap:'3', kleur:'grey',
        waarde: escapeHtml(z.weergave.gemiddelde),
        balk: balkHtml(schaal(z.gemiddelde, Z_MIN, Z_MAX)),
        lijnen: z.aantal > 1
          ? ['Hoogste waarde: ' + z.weergave.hoogste, 'Laagste waarde: ' + z.weergave.laagste]
          : [],
        werk: z.aantal + (z.aantal === 1 ? ' gemeten waarde' : ' gemeten waardes') +
          ' · schaal ' + Z_MIN + '-' + Z_MAX + '%'
      });
    }

    // 4 - Vulling, als percentage van het etiket. 100% is precies wat er op
    // het etiket staat.
    var vulling = '';
    var v = l.vulling;
    if (v && v.weergave){
      var telling = [];
      if (v.boven) telling.push(v.boven + ' boven');
      if (v.onder) telling.push(v.onder + ' onder');
      if (v.gelijk) telling.push(v.gelijk + ' precies');
      vulling = blokHtml({
        label:'Onder of boven vulling', sub:'Gemiddeld', stap:'4', kleur:'grey',
        waarde: escapeHtml(v.weergave.gemiddelde),
        balk: balkHtml(naderEtiket(v.gemiddelde)),
        lijnen: v.aantal > 1
          ? ['Hoogste waarde: ' + v.weergave.hoogste, 'Laagste waarde: ' + v.weergave.laagste]
          : [],
        werk: v.aantal + (v.aantal === 1 ? ' gemeten waarde' : ' gemeten waardes') +
          (telling.length ? ' · ' + telling.join(', ') : '') +
          ' · 100% = het etiket, de balk is dan vol'
      });
    }

    return '<div class="blokken">' +
      '<div class="blokken-rij vier">' + openheid + bewijs + zuiver + vulling + '</div>' +
      '</div>';
  }

  // --- Blok 5: het laboratorium en wat de metingen laten zien --------------
  //
  // Zelfde vorm als blok 4, en met opzet: dit zijn tellingen en gemiddelden,
  // geen oordeel. Geen kleur en geen balk - een balk toont een aandeel, en een
  // aandeel nodigt uit tot een weging die niemand heeft vastgesteld. B-1 en
  // B-2 van het regelblad staan nog open bij Annemarie.
  //
  // De getallen en hun schrijfwijze komen uit src/blokken.js. Hier alleen de
  // vorm.


  // --- Blok 4: wat de rapporten over de waarden zeggen ---------------------
  //
  // De zichtbare kant van niveaus.js. Per uitspraak - hoeveelheid, zuiverheid,
  // identiteit - staat hier hoeveel rapporten geverifieerd zijn, hoeveel
  // gerapporteerd, en over hoeveel wij niets zeggen.
  //
  // LET OP - GEEN KLEUR EN GEEN BALK. Besluit A24: het blok toont bewijs-
  // dekking, geen goed/slecht. Een balk zou een aandeel tonen, en een aandeel
  // nodigt uit tot een oordeel over de verhouding dat niemand heeft gegeven.
  // De drie standen verschillen alleen in inktsterkte.
  //
  // De getallen worden hier NIET bedacht: src/blokken.js telt ze en schrijft
  // de zinnen. Deze functie zet ze neer.
  var WAARDEN_NAAM = {
    vulling: 'Hoeveelheid in de vial',
    zuiverheid: 'Zuiverheid',
    identiteit: 'Identiteit van de stof'
  };
  // De zinnen per uitspraak staan hierboven al als telling; die zou dubbel
  // lezen. Deze standen zeggen iets wat de telling niet laat zien.
  var WAARDEN_NOTITIES = ['methode_niet_verifieerbaar', 'gedeeld_labbewijs', 'promotie_geblokkeerd'];

  // LET OP - NIET MEER AANGEROEPEN sinds 23 september. Op verzoek van Ruben
  // toont het rapport vier tegels en niet meer dit blok. De functie blijft
  // staan omdat hij de zichtbare kant is van het besluit van Annemarie van
  // 20 september (geverifieerd / gerapporteerd / niets over te zeggen); dat
  // besluit is niet ingetrokken, alleen deze weergave is eruit. Terugzetten
  // is een regel: + waardenHtml(c) in blokkenHtml.
  function waardenHtml(c){
    var b = blokkenVan(c);
    var w = b && b.waarden;
    if (!w || !w.beschikbaar) return '';
    var telling = w.telling || {};
    var regels = w.regels || [];

    var rijen = '';
    Object.keys(WAARDEN_NAAM).forEach(function(o){
      var t = telling[o];
      if (!t) return;
      var standen = '';
      if (t.geverifieerd) standen += '<span class="waarden-stand is-geverifieerd"><b>' + t.geverifieerd + '</b> onafhankelijk bevestigd</span>';
      if (t.gerapporteerd) standen += '<span class="waarden-stand is-gerapporteerd"><b>' + t.gerapporteerd + '</b> gerapporteerd</span>';
      if (t.niets) standen += '<span class="waarden-stand is-niets"><b>' + t.niets + '</b> niets over te zeggen</span>';
      if (!standen) return;
      rijen += '<div class="waarden-rij">' +
        '<span class="waarden-naam">' + escapeHtml(WAARDEN_NAAM[o]) + '</span>' +
        '<span class="waarden-standen">' + standen + '</span></div>';
    });
    if (!rijen) return '';

    // De voorwaarde van Annemarie bij "gerapporteerd": voor de gebruiker moet
    // heel duidelijk zijn dat dit een waarde uit het document van de
    // aanbieder is. De zin komt uit de backend, niet uit deze pagina.
    var uitleg = '';
    for (var i = 0; i < regels.length; i++){
      if (regels[i].stand === 'gerapporteerd' && regels[i].toelichting){
        uitleg = '<p class="waarden-notitie">' + escapeHtml(regels[i].toelichting) + '</p>';
        break;
      }
    }

    var notities = '';
    regels.forEach(function(r){
      if (WAARDEN_NOTITIES.indexOf(r.stand) === -1) return;
      notities += '<p class="waarden-notitie">' + escapeHtml(r.zin) +
        (r.toelichting ? '<span class="klein">' + escapeHtml(r.toelichting) + '</span>' : '') + '</p>';
    });

    return '<div class="waarden">' +
      '<p class="waarden-kop">Wat de rapporten over de waarden zeggen<span class="waarden-stap">3</span></p>' +
      rijen + uitleg + notities +
      (w.werkregel ? '<div class="waarden-werk mono">' + escapeHtml(w.werkregel) + '</div>' : '') +
      '</div>';
  }

  // Het vervolgvak onder de blokken. Vijf varianten, altijd na de uitslag:
  // eerst geven, dan pas vragen.
  //
  // LET OP: insturen, mailen en "hou me op de hoogte" hebben nog geen
  // eindpunt. Zolang dat zo is staat de tekst er wel en de knop niet - liever
  // geen knop dan een knop die niets doet. Alleen de labpagina werkt al,
  // want dat is een link naar het laboratorium zelf.
  // Iconen staan in het ontwerp inline vóór de titel, 24px, en verdwijnen
  // onder de 700px. Font Awesome zit niet in deze build, dus dit zijn dezelfde
  // vormen als losse svg's.
  var VERVOLG_ICONEN = {
    vraag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><path d="M10.4 12.6a1.8 1.8 0 1 1 2.4 2.3c-.5.3-.8.8-.8 1.4"/><line x1="12" y1="18.5" x2="12" y2="18.5"/></svg>',
    kruis: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><polyline points="14 3 14 8 19 8"/><line x1="9.5" y1="13" x2="14.5" y2="18"/><line x1="14.5" y1="13" x2="9.5" y2="18"/></svg>',
    klok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/></svg>',
    envelop: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><polyline points="3.5 6.5 12 13 20.5 6.5"/></svg>',
    waarschuwing: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 4.3 2.6 17.5A1.9 1.9 0 0 0 4.3 20.4h15.4a1.9 1.9 0 0 0 1.7-2.9L13.7 4.3a1.9 1.9 0 0 0-3.4 0z"/><line x1="12" y1="9.5" x2="12" y2="14"/><line x1="12" y1="17" x2="12" y2="17"/></svg>'
  };

  function vervolgHtml(c){
    var b = blokkenVan(c);
    if (!b) return '';
    var ve = b.verificatie || {}, pb = b.productbewijs || {}, t = ve.telling || {};
    var labUrl = null;
    (ve.stippen || []).some(function(p){
      if (p.officieleBron) { labUrl = p.officieleBron; return true; }
      return false;
    });
    var v;
    if (!ve.totaal) {
      v = { soort:'vraag', icoon:'vraag', titel:'Heb jij wel een rapport van deze shop?',
        tekst:'Wij vonden er geen. Heb jij er een gekregen bij je bestelling, of weet je waar ze staan? Stuur het in, dan controleren we het bij het laboratorium en werken we deze pagina bij.' };
    } else if (pb.kleur === 'red') {
      v = { soort:'waarschuwing', icoon:'waarschuwing', titel:'Wat wij nu doen',
        tekst:'Wij leggen deze uitslag voor aan de shop en controleren of andere batches hetzelfde laten zien. De bevinding hieronder blijft staan, wat daar ook uitkomt.' };
    } else if (t.geverifieerd === 0 && t.wachtrij > 0) {
      v = { soort:'wacht', icoon:'klok', titel:'Deze rapporten staan bij ons in de wachtrij',
        tekst:'Het laboratorium laat ons niet automatisch meekijken, dus controleren wij deze rapporten met de hand. Deze pagina wordt bijgewerkt zodra dat gebeurd is.' };
    } else if (t.geverifieerd === 0 && (t.codeWeggehaald > 0 || t.geenCode > 0)) {
      v = { soort:'vraag', icoon:'kruis', titel:'Wij kunnen deze rapporten niet natrekken',
        tekst:'Op de rapporten ontbreekt het nummer waarmee het laboratorium kan bevestigen dat ze bestaan. Heb jij een origineel waar dat nummer nog wel op staat? Dan controleren we het alsnog.' };
    } else {
      v = { soort:'bewaar', icoon:'envelop', titel:'Bewaar dit rapport',
        tekst:'Wij kijken regelmatig opnieuw. Komt er een rapport bij, verdwijnt er een, of verandert er iets aan de uitkomst, dan is dat hier te zien.' };
    }
    // In het ontwerp staat bovenaan een primaire knop en daaronder een
    // tekstlink. De knop hoort per variant bij een actie: "Rapport insturen",
    // "Orgineel insturen", "Hou me op de hoogte", "Mail mij dit rapport".
    //
    // LET OP: geen van die vier heeft een eindpunt. Zolang dat zo is zetten we
    // hem er NIET neer - liever geen knop dan een knop die niets doet. De
    // stijl staat wel klaar in bedrijfchecker.css (.vervolg-knop), en
    // hieronder hoeft alleen v.knop gevuld te worden zodra het eindpunt er is.
    var acties = [];
    if (v.knop && v.knopActie){
      acties.push('<button type="button" class="vervolg-knop" data-actie="' +
        escapeHtml(v.knopActie) + '">' + escapeHtml(v.knop) + '</button>');
    }
    if (labUrl){
      acties.push('<a class="vervolg-link" href="' + escapeHtml(labUrl) + '" target="_blank" rel="noopener">Toon de labpagina</a>');
    }
    // Twee acties onder elkaar krijgen onder de 700px minder ruimte onderaan
    // (24 rondom, 12 onder), anders valt er een gat onder de laatste link.
    var klassen = ['vervolg-vak', v.soort];
    if (acties.length >= 2) klassen.push('twee-acties');
    if (!acties.length) klassen.push('geen-acties');
    var icoon = VERVOLG_ICONEN[v.icoon] ? '<span class="vervolg-icoon">' + VERVOLG_ICONEN[v.icoon] + '</span>' : '';
    return '<div class="' + klassen.join(' ') + '">' +
      '<div class="vervolg-tekst">' +
        '<span class="vervolg-titel">' + icoon + escapeHtml(v.titel) + '</span>' +
        '<span class="vervolg-sub">' + escapeHtml(v.tekst) + '</span>' +
      '</div>' +
      (acties.length ? '<div class="vervolg-acties">' + acties.join('') + '</div>' : '') +
      '</div>';
  }

  // Schermafdruk van de website, in een browservenster. De backend maakt hem
  // tijdens de run en bewaart hem een maand; is hij er nog niet, dan geeft de
  // route 404 en zetten we de lege plek neer (zie wiring in renderDetail).
  function siteShotHtml(c){
    var host = domainOf(c.website);
    var url = API_BASE + '/api/sites/' + encodeURIComponent(host) + '/screenshot';
    return '<figure class="site-shot">' +
      '<div class="site-shot-bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>' +
      '<span class="site-shot-url">' + escapeHtml(host) + '</span></div>' +
      '<div class="site-shot-img">' +
      '<img class="site-shot-foto" src="' + escapeHtml(url) + '" alt="Schermafdruk van ' + escapeHtml(host) + '" loading="lazy">' +
      '<div class="site-shot-leeg" hidden>Schermafdruk wordt bij de volgende run gemaakt</div>' +
      '</div></figure>';
  }

  // Wat er hergebruikt is uit het archief. Een leverancier die stil een
  // rapport vervangt of weghaalt is een bevinding, geen technisch detail,
  // dus dat hoort in het rapport te staan en niet alleen in de logs.
  function archiefRegel(c){
    var crawl = (c.phaseData && c.phaseData.coaDataset && c.phaseData.coaDataset.data && c.phaseData.coaDataset.data.crawl) || null;
    var a = crawl && crawl.archief;
    if (!a) return '';
    var gelezen = (a.hergebruikt || 0) + (a.opnieuwGelezen || 0);
    if (!gelezen && !a.verdwenen && !a.terug) return '';
    var delen = [];
    if (gelezen){
      delen.push(gelezen + (gelezen === 1 ? ' certificaat' : ' certificaten') + ' verwerkt: ' +
        (a.hergebruikt || 0) + ' uit het archief, ' + (a.opnieuwGelezen || 0) + ' nu opnieuw gelezen');
    }
    if (a.vervangen) delen.push(a.vervangen + ' rapport' + (a.vervangen === 1 ? ' is' : 'en zijn') + ' sinds de vorige controle vervangen door een ander bestand op dezelfde plek');
    if (a.verdwenen) delen.push(a.verdwenen + ' rapport' + (a.verdwenen === 1 ? ' stond' : 'en stonden') + ' er eerder wel en nu niet meer');
    if (a.terug) delen.push(a.terug + ' eerder verdwenen rapport' + (a.terug === 1 ? ' staat' : 'en staan') + ' er weer');
    return '<p class="rapport-voetnoot">' + escapeHtml(delen.join('. ') + '.') + '</p>';
  }

  // ---------- Het rapport, opnieuw opgebouwd (20 september) ----------
  //
  // Vervangt de gegroeide opzet met "Rapport details", een losse upsell-banner
  // en een tweede deepdive-kaart met een ander bedrag. De pagina heeft nu vier
  // delen, in leesvolgorde: de kop, de drie blokken met de vervolgstap, het
  // bewijs, en onze lezing. Daarna pas de verdieping.

  // Eén plek voor de prijs. Hij stond in twee functies, met twee bedragen, en
  // in de projectdocumenten weer een derde.
  var DEEPDIVE_PRIJS_HEEL = '3';
  var DEEPDIVE_PRIJS_CENT = '50';
  var DEEPDIVE_KVK = '2,95';

  function rapportKop(c){
    var naam = bedrijfsnaam(c);
    var meta = (naam ? '<span class="rk-domein">' + escapeHtml(domainOf(c.website)) + '</span>' : '') +
      '<span class="rk-datum">gecontroleerd ' + fmtDateLang(c.createdAt) + '</span>' +
      (c.momentopname ? '<span class="rk-datum">momentopname #' + escapeHtml(String(c.momentopname)) + '</span>' : '');
    // Op desktop staat de vestigingsregel naast de titel (besluit Ruben,
    // 23 september); onder 700px valt hij eronder. Daarom staat hij hier in
    // de kop en niet als los blok eronder.
    return '<header class="rapport-kop">' +
      '<div class="rk-meta">' + meta + '</div>' +
      '<div class="rk-titelrij">' +
        '<h2 class="rk-titel">' + escapeHtml(naam || domainOf(c.website)) + '</h2>' +
        vestigingHtml(c) +
      '</div>' +
      korteUitleg(c) + '</header>';
  }


  // --- vestiging: waar zit deze leverancier, en kan de verdieping ------------
  //
  // Besluit Ruben 22 september: EU gaat over de juridische vestiging, niet het
  // verzendland. De Deep Dive draait alleen op Nederlandse leveranciers, omdat
  // de verdieping op het KvK-handelsregister leunt.
  //
  // De teksten komen UIT DE BACKEND (vestiging.js), niet uit deze pagina. Zo
  // zegt het rapport hetzelfde als de stafpagina en staat een wijziging op een
  // plek. Hier alleen de vorm.
  function vestigingVan(c){
    return (c.engineResult && c.engineResult.vestiging) || c.vestiging || null;
  }

  // Naar Anne's ontwerp (Figma "EU NL uitklap", 23 september): de regel zelf is
  // de knop. Klikken opent een overlay met de uitleg; nog eens klikken, ernaast
  // klikken of Escape sluit hem. De overlay legt zich over de inhoud eronder en
  // duwt de pagina dus niet omlaag.
  var vestTeller = 0;

  function sluitVestiging(sec){
    if (!sec || !sec.classList) return;
    sec.classList.remove('open');
    var knop = sec.querySelector('.vest-regel');
    if (knop) knop.setAttribute('aria-expanded', 'false');
    var paneel = sec.querySelector('.vest-paneel');
    if (paneel) paneel.hidden = true;
  }

  function wisselVestiging(sec){
    if (!sec) return;
    if (sec.classList.contains('open')) { sluitVestiging(sec); return; }
    // Er staat er nooit meer dan een open.
    Array.prototype.forEach.call(document.querySelectorAll('.vestiging.open'), sluitVestiging);
    sec.classList.add('open');
    var knop = sec.querySelector('.vest-regel');
    if (knop) knop.setAttribute('aria-expanded', 'true');
    var paneel = sec.querySelector('.vest-paneel');
    if (paneel) paneel.hidden = false;
  }

  function vestigingHtml(c){
    var v = vestigingVan(c);
    if (!v || !v.weergave) return '';
    var soort = v.weergave.sleutel || 'onbekend';
    // Afgeleid is een voorstel, geen vaststelling. Dat verschil hoort
    // zichtbaar te blijven, ook voor een bezoeker.
    var afgeleid = v.herkomst === 'afgeleid';
    var merk = (soort === 'nl' || soort === 'eu')
      ? '<span class="vest-merk ' + soort + '" aria-hidden="true">' + soort.toUpperCase() + '</span>'
      : '';
    var dd = v.deepDive || null;
    var ddRegel = dd
      ? '<p class="vest-deepdive' + (dd.mogelijk ? ' kan' : '') + '">' +
          (dd.mogelijk ? 'Verdieping mogelijk' : 'Verdieping niet mogelijk') +
          (dd.reden ? ' &middot; ' + escapeHtml(dd.reden) : '') + '</p>'
      : '';
    var id = 'vest-uitleg-' + (++vestTeller);
    return '<section class="vestiging" data-soort="' + escapeHtml(soort) + '">' +
      '<button type="button" class="vest-regel js-vest-regel" aria-expanded="false" aria-controls="' + id + '">' +
        merk +
        '<span class="vest-naam">' + escapeHtml(v.weergave.kop) + '</span>' +
        (afgeleid ? '<span class="vest-afgeleid">' + escapeHtml(v.weergave.herkomstLabel || 'nog niet gecontroleerd') + '</span>' : '') +
        '<span class="vest-chev" aria-hidden="true">' + ICON_CHEVRON + '</span>' +
      '</button>' +
      '<div class="vest-paneel" id="' + id + '" hidden>' +
        '<p class="vest-tekst">' + escapeHtml(v.weergave.tekst) + '</p>' +
        (afgeleid && v.weergave.herkomstUitleg
          ? '<p class="vest-herkomst">' + escapeHtml(v.weergave.herkomstUitleg) + '</p>' : '') +
        ddRegel +
      '</div>' +
    '</section>';
  }

  function groepHtml(titel, uitleg, itemsHtml, smal){
    if (!itemsHtml) return '';
    return '<section class="groep">' +
      '<div class="groep-kop"><h3>' + escapeHtml(titel) + '</h3>' +
      (uitleg ? '<p>' + escapeHtml(uitleg) + '</p>' : '') + '</div>' +
      '<div class="accordion' + (smal ? ' smal' : '') + '">' + itemsHtml + '</div></section>';
  }

  // --- groep 1: wat we hebben gevonden ---
  function bewijsGroep(c, engine, r, coaRecords, documents){
    if (!engine || !engine.assessments) return '';
    var bl = blokkenVan(c) || {};
    var aantalRapporten = (bl.verificatie && bl.verificatie.totaal) || coaRecords.length;
    var labs = {};
    coaRecords.forEach(function(x){ if (x && x.laboratorium) labs[String(x.laboratorium).toLowerCase()] = 1; });
    var aantalLabs = Object.keys(labs).length;
    function beoordeeld(pillar){
      return pillarCategoryIds(pillar).filter(function(id){
        var a = engine.assessments[id];
        return a && a.color && a.color !== 'white';
      }).length;
    }
    function tel(n, enkel, meer){ return n + ' ' + (n === 1 ? enkel : meer); }

    // De Evidence Score hoort bij blok 3, dus de onderbouwing staat bij het
    // bewijs waar het getal op rust - niet als losse regel tussen de
    // conclusies, waar hij twee keer hetzelfde zei.
    var coaBody = pijlerBody(engine, 'COA');
    var score = evidenceScoreBody(engine);
    if (coaBody && score) coaBody += '<div class="acc-category"><h4>Hoe dit getal tot stand komt</h4>' + score + '</div>';
    var deep = supplierScoreBody(engine, c.tier);
    if (coaBody && deep) coaBody += '<div class="acc-category"><h4>Supplier Score (Deep Dive)</h4>' + deep + '</div>';

    var documentenBody = quantityBody(coaRecords, engine) +
      ((r.documentanalyse && r.documentanalyse.length)
        ? '<ul class="findings">' + r.documentanalyse.map(function(d){
            return '<li>' + escapeHtml(d.omschrijving || '') +
              '<span class="src">Product: ' + escapeHtml(d.product || 'onbekend') + ' &middot; Batch: ' + escapeHtml(d.batchnummer || 'onbekend') +
              ' &middot; Purity: ' + escapeHtml(d.purity || 'onbekend') + ' &middot; Lab: ' + escapeHtml(d.laboratorium || 'onbekend') + '</span></li>';
          }).join('') + '</ul>'
        : '') +
      ((documents && documents.length)
        ? '<h4 class="acc-subkop">Geüploade documenten</h4><ul class="findings">' +
          documents.map(function(d){ return '<li>' + escapeHtml(d.filename) + '</li>'; }).join('') + '</ul>'
        : '');

    // Eén regel per bron. Stond eerder onderaan als een reeks links zonder
    // scheiding, die als een doorlopende plakzin renderde.
    var bronnenBody = (r.bronnenregister && r.bronnenregister.length)
      ? '<div class="bronnen">' + r.bronnenregister.map(function(b){
          return '<div class="bron"><a href="' + escapeHtml(b.url) + '" target="_blank" rel="noopener">' +
            escapeHtml(b.titel || b.url) + '</a></div>';
        }).join('') + '</div>'
      : '';

    var items = accItem('COA & productbewijs', coaBody, { columns:true,
        telling: aantalRapporten ? (tel(aantalRapporten, 'rapport', 'rapporten') + ' · ' + beoordeeld('COA') + ' van 9 beoordeeld') : 'geen rapporten' }) +
      accItem('Laboratorium', pijlerBody(engine, 'LAB'), { columns:true,
        telling: aantalLabs ? tel(aantalLabs, 'genoemd', 'genoemd') : 'niet genoemd' }) +
      accItem('Bedrijf', pijlerBody(engine, 'COMPANY'), { columns:true,
        telling: c.tier === 'deep' ? '' : 'light versie' }) +
      accItem('Reputatie & commerciële transparantie', pijlerBody(engine, 'REPUTATION'), { columns:true,
        telling: beoordeeld('REPUTATION') ? tel(beoordeeld('REPUTATION'), 'beoordeeld', 'beoordeeld') : 'niet beoordeeld' }) +
      accItem('Wat er letterlijk op de rapporten staat', documentenBody, { plain:true,
        sub:'letterlijke uitlezing, niet geverifieerd',
        telling: aantalRapporten ? tel(aantalRapporten, 'document', 'documenten') : '' }) +
      accItem('Bronnenregister', bronnenBody, { plain:true,
        telling: (r.bronnenregister && r.bronnenregister.length) ? tel(r.bronnenregister.length, 'bron', 'bronnen') : '' });

    return groepHtml('Het bewijs achter deze samenvatting',
      'Wat we hebben gevonden en gelezen. Elke regel hieronder heeft een bron.', items) + archiefRegel(c);
  }

  // --- groep 2: wat wij eruit lezen ---
  function lezingGroep(r){
    var rode = (r.rodeVlaggen && r.rodeVlaggen.length) ? r.rodeVlaggen.length : 0;
    var items = accItem('In het kort', klemBlok(alineasHtml(r.executiveSummary)), { plain:true }) +
      accItem('Sterkste positieve bevindingen', bevindingenLijst(r.sterkstePositieveBevindingen, 'ok'),
        { plain:true, telling: String((r.sterkstePositieveBevindingen || []).length || '') }) +
      accItem('Belangrijkste aandachtspunten', bevindingenLijst(r.belangrijksteAandachtspunten, ''),
        { plain:true, telling: String((r.belangrijksteAandachtspunten || []).length || '') }) +
      // Heette "Rode vlaggen". Staat er nu ook als het er nul zijn: leeg is
      // hier het nieuws, en een lege lijst zegt iets anders dan een lege bak.
      accItem('Aangetoonde problemen', rode
        ? '<ul class="findings">' + r.rodeVlaggen.map(function(f){
            return '<li class="danger">' + escapeHtml(f.omschrijving || f) +
              (f.bron ? '<span class="src">Bron: ' + escapeHtml(f.bron) + '</span>' : '') + '</li>';
          }).join('') + '</ul>'
        : '<p>Geen. Wij noemen alleen iets een probleem als het aantoonbaar is. Dat wij iets niet konden controleren, is geen probleem van deze shop.</p>',
        { plain:true, telling: rode ? String(rode) : 'geen' }) +
      accItem('Wat wij niet konden vaststellen', bevindingenLijst(r.nietVerifieerbaar, ''),
        { plain:true, telling: String((r.nietVerifieerbaar || []).length || '') }) +
      accItem('Eindconclusie', klemBlok(alineasHtml(r.eindconclusie)), { plain:true });
    return groepHtml('Wat wij hieruit lezen',
      'Onze lezing van het bewijs hierboven. Bewust gescheiden: hierboven staat wat er is, hier staat wat wij ervan vinden.',
      items, true);
  }

  // --- groep 3: zelf verder ---
  function zelfVerderGroep(r){
    if (!(r.top5Vragen && r.top5Vragen.length)) return '';
    return groepHtml('Zelf verder', 'Wat je hiermee kunt doen zonder ons.',
      accItem('Vragen die je deze shop kunt stellen',
        '<ol class="numbered">' + r.top5Vragen.map(function(q){ return '<li>' + escapeHtml(q) + '</li>'; }).join('') + '</ol>',
        { plain:true, telling: String(r.top5Vragen.length) }));
  }

  // --- de verdieping, één kaart ---
  function deepdiveKaart(){
    return '<section class="deepdive-card">' +
      '<div class="deepdive-head">' +
      '<h3 class="deepdive-title">Nog meer Proof met een deepdive</h3>' +
      '<span class="deepdive-price"><span class="klein">Voor slechts</span>' +
      '<span class="groot">&euro; ' + DEEPDIVE_PRIJS_HEEL + ',<span class="cent">' + DEEPDIVE_PRIJS_CENT + '</span></span></span>' +
      '</div>' +
      '<p>De Deep Dive bevat de analyse hierboven en trekt daarna de leverancier zelf open.</p>' +
      '<ul>' +
        '<li>Officiële bedrijfsregistratie, opgevraagd bij de KVK (t.w.v. &euro; ' + DEEPDIVE_KVK + ')</li>' +
        '<li>Welke onderneming daadwerkelijk achter de webshop zit</li>' +
        '<li>Bedrijfshistorie, adressen en zakelijke verbanden uit officiële bronnen</li>' +
        '<li>Je eigen batch laten controleren met een foto van het product</li>' +
      '</ul>' +
      '<div class="deepdive-actions">' +
        '<button type="button" class="btn-cta js-continue-deep" id="continue-deep">Ja, ik wil de verdieping</button>' +
        '<button type="button" class="textlink js-deepdive-info"><span>Meer weten over de Deepdive</span> ' + ICON_CHEVRON + '</button>' +
      '</div></section>';
  }

  function renderReport(c){
    var r = c.report || {};
    var engine = c.engineResult;
    var documents = c.documents || [];
    var coaRecords = (c.phaseData && c.phaseData.coaDataset && c.phaseData.coaDataset.data && c.phaseData.coaDataset.data.coaRecords) || [];

    var out = '<div class="rapport">';
    out += rapportKop(c);
    out += blokkenHtml(c);
    out += vervolgHtml(c);
    out += bewijsGroep(c, engine, r, coaRecords, documents);
    out += lezingGroep(r);
    out += zelfVerderGroep(r);

    if (c.tier !== 'deep'){
      out += '<div class="rapport-einde"><h3>Einde van de gratis check.</h3>' +
        '<p>Dit ging over het product. De verdiepingscheck gaat over het bedrijf.</p></div>';
      out += deepdiveKaart();
    }

    out += '<p class="rapport-footer">' + (c.tier === 'deep'
      ? 'Dit rapport is de betaalde Deep Dive, automatisch samengesteld op basis van openbare bronnen, en dient uitsluitend voor due-diligence-oriëntatie. Het bevat geen medisch advies en geen garantie over productveiligheid of geschiktheid voor menselijk gebruik.'
      : 'Dit rapport is de gratis Evidence Check, automatisch samengesteld op basis van openbare bronnen, en dient uitsluitend voor due-diligence-oriëntatie. Het bevat geen medisch advies en geen garantie over productveiligheid of geschiktheid voor menselijk gebruik. Een ontbrekend KvK-uittreksel verlaagt geen enkele score automatisch.') +
      '</p>';

    out += '</div>';
    return out;
  }

  // De balken slaan om de beurt uit en het percentage telt mee omhoog.
  function startBalken(root){
    var balken = (root || document).querySelectorAll('.stat-bar');
    var rustig = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    Array.prototype.forEach.call(balken, function(balk, i){
      var doel = Number(balk.getAttribute('data-pct')) || 0;
      // Het meetellende getal staat niet meer in de balk zelf maar in het
      // blok erboven (Openheid telt naar 8, niet naar 80%). data-telop zegt
      // naar welk getal geteld wordt; staat het er niet, dan blijft de tekst
      // zoals hij is en slaat alleen de balk uit.
      var telopDoel = balk.hasAttribute('data-telop') ? Number(balk.getAttribute('data-telop')) : null;
      var blok = balk.closest ? balk.closest('.blok') : null;
      var getal = balk.querySelector('.stat-bar-value') || (blok ? blok.querySelector('.js-telop') : null);
      var isPct = !!balk.querySelector('.stat-bar-value');
      var eind = telopDoel != null ? telopDoel : doel;
      if (rustig){
        balk.classList.add('is-on');
        if (getal) getal.textContent = eind + (isPct ? '%' : '');
        return;
      }
      setTimeout(function(){
        balk.classList.add('is-on');
        var start = null, duur = 1100;
        function stap(t){
          if (start === null) start = t;
          var v = Math.min(1, (t - start) / duur);
          var e = 1 - Math.pow(1 - v, 3);
          if (getal) getal.textContent = Math.round(eind * e) + (isPct ? '%' : '');
          if (v < 1) requestAnimationFrame(stap);
        }
        requestAnimationFrame(stap);
      }, 180 * i);
    });
  }

  // ---------- retry-acties ----------
  // Eén stap (of "vanaf deze stap") opnieuw draaien: POST /api/audits/:id/retry-step.
  // De backend draait daarbij ook automatisch categorize + de scoring-engine +
  // een volledige hersynthese, zodat het rapport nooit verouderd blijft t.o.v.
  // de net vernieuwde brondata van die ene stap.
  async function runSingleStep(caseId, key){
    if (state.runningCaseIds[caseId]) return;
    state.runningCaseIds[caseId] = true;
    state.runningStepKeys[caseId] = key;
    if (state.currentCaseId === caseId) render();
    try {
      var updated = await apiRetryStep(caseId, key);
      if (state.currentCaseId === caseId){ state.currentCase = updated; }
    } catch(e){
      if (state.currentCaseId === caseId){
        try { state.currentCase = await apiGetCase(caseId); } catch(e2){}
      }
      alert('Opnieuw proberen is mislukt: ' + (e && e.message ? e.message : 'onbekende fout'));
    } finally {
      delete state.runningCaseIds[caseId];
      delete state.runningStepKeys[caseId];
      if (state.currentCaseId === caseId) render();
    }
  }

  // Dezelfde case opnieuw draaien. Voorheen startte dit een nieuwe audit,
  // waardoor je bij elke herhaling een dubbele in je lijst kreeg. Nu blijft
  // het dezelfde case: zelfde id, zelfde link, zelfde documenten.
  async function rerunCase(c){
    var btn = app.querySelector('#retry-audit');
    var oorspronkelijk = btn ? btn.textContent : '';
    if (btn){ btn.disabled = true; btn.textContent = 'Starten…'; }
    try {
      var updated = await apiRerunCase(c.id);
      state.currentCase = updated;
      var i = state.cases.findIndex(function(x){ return x.id === c.id; });
      if (i !== -1) state.cases[i] = updated;
      render();
      if (updated.status === 'bezig') ensureCasePoller(c.id);
    } catch(e){
      if (btn){ btn.disabled = false; btn.textContent = oorspronkelijk; }
      alert('Opnieuw draaien is mislukt: ' + (e && e.message ? e.message : 'onbekende fout'));
    }
  }

  // ---------- wire up ----------
  document.getElementById('brand-home').addEventListener('click', goDashboard);
  initApp();

})();
</script>
